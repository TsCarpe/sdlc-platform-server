# 本地容器验证（EXEC-PLAN-K8s 阶段 1 批次 D）：server 镜像 + MySQL 全套起容器，宿主跑黑盒回归。
# 用法（顺序勿乱——verify-all 会暂停/恢复进程内 agent，verify-agent 要在恢复后独立跑）：
#   ① SERVER_IMAGE=sdlc-platform-server:local SDLC_AGENT_API_KEY=<key> \
#      docker compose -f compose/server.verify.yml up -d --wait
#      （--wait 只等容器 running/healthcheck，不等应用绑定端口——起后 curl /api/health 就绪再跑 ②）
#   ② SDLC_DB_DSN=mysql://root:sdlc@127.0.0.1:13306/sdlc bash scripts/verify-all.sh http://127.0.0.1:8888
#      （不带 SDLC_VERIFY_AGENT——12 黑盒；verify-token 自建临时实例走宿主 13306）
#   ③ SDLC_AGENT_BASE_URL/MODEL/API_KEY=… node scripts/verify-agent.mjs http://127.0.0.1:8888   # 真模型冒烟
#   ④ docker compose -f compose/server.verify.yml down -v
# 宿主 3306 映射为 13306：与 compose/mysql.dev.yml（3306）可并存，无需先停开发库。
# agent 三元组密钥经宿主 env 透传，不落本文件。
# 独立项目名：与同目录 mysql.dev.yml 区分项目（compose 默认项目名 = 目录名「compose」——不显式
# 命名的话，两文件的 mysql 服务同项目互顶，up 验证栈会静默重建开发库容器）。
name: sdlc-verify
services:
  mysql:
    image: mysql:8.0.40
    container_name: sdlc-mysql-verify
    environment:
      MYSQL_ROOT_PASSWORD: sdlc
      MYSQL_DATABASE: sdlc
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:13306:3306"   # 宿主 verify-token 临时实例用（避开 dev MySQL 的 3306）
    volumes:
      - sdlc-verify-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psdlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: ${SERVER_IMAGE:-sdlc-platform-server:local}
    container_name: sdlc-server-verify
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      TZ: Asia/Shanghai
      SDLC_DB_DSN: mysql://root:sdlc@mysql:3306/sdlc   # 容器网络内走服务名；宿主侧对应 13306
      SDLC_AGENT_ENABLED: "true"   # Settings 默认 false——verify-agent 第一步断言 enabled，漏配必红
      SDLC_AGENT_BASE_URL: ${SDLC_AGENT_BASE_URL:-}
      SDLC_AGENT_MODEL: ${SDLC_AGENT_MODEL:-}
      SDLC_AGENT_API_KEY: ${SDLC_AGENT_API_KEY:-}
    volumes:
      - sdlc-verify-data:/data
      # 黑盒脚本（verify-v4/change/m5）在宿主仓根 tasks/<id>/out/ 落 source_import 夹具，
      # 服务端却在容器卷内 /data/ws 读——开发机同仓根天然同见，容器化后必须绑定挂载对齐文件面。
      # 注意：compose 相对路径以本文件所在目录解析，故为 ../tasks
      - ../tasks:/data/ws/tasks

volumes:
  sdlc-verify-mysql:
  sdlc-verify-data:
