[project]
name = "platform-sdlc"
version = "0.3.0"
description = "SDLC 产物协作平台后端（Python/FastAPI，自 v3 起）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai-agents>=0.2",
    "pymysql[rsa]>=1.2.3",
    "dbutils>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyright>=1.1.350",
    "ruff>=0.5",
    "import-linter>=2.0",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_sdlc"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# 测试白盒调私有（_RESULT_LINE/_resolve_in_workspace/_safe_static_file）是正当场景，仅 tests 放开
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.ruff]
line-length = 140  # SQL 移植行较长（与 Java 逐行对应），放宽行宽而非打断 SQL
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prompt/工具 docstring 是给模型的指令文本（长句不可断行——断行改变语义），豁免行宽
"src/platform_sdlc/agent/prompts.py" = ["E501"]
"src/platform_sdlc/agent/tools.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
