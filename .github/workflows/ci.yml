name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 契约快照守门（AUDIT D8-6）：契约面（端点/出参模型）变更必须重跑 export-openapi 并携带快照 commit——
      # 快照与代码不一致即红，防权威文档再漂移
      - run: node scripts/export-openapi.mjs
      - run: git diff --exit-code docs/openapi.json

  # 存量清理中（AUDIT D8-4 补强：基线 155 → 清理进行时），清零后并入 check 转阻塞门
  pyright:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pyright
