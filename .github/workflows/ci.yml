name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      # 类型门（AUDIT D8-4：存量 155 → 2026-10-13 清零，转阻塞）
      - run: uv run pyright
      - run: uv run pytest -q
      # 任务模板三处一致性守门（v4-3，DESIGN-v4 §6.1）：prompts.py ∪ runner.mjs promptFor ∪
      # task_rules/DEFAULT_RULES——每新增任务类型三处同步，漏一处 CI 红
      - run: uv run python scripts/check_task_templates.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 契约快照守门（AUDIT D8-6）：契约面（端点/出参模型）变更必须重跑 export-openapi 并携带快照 commit——
      # 快照与代码不一致即红，防权威文档再漂移
      - run: node scripts/export-openapi.mjs
      - run: git diff --exit-code docs/openapi.json
