# ⚠ 本文件只是字段清单权威，占位值不可 apply——真值走 kubectl create secret（runbook §3）：
#   kubectl -n <ns> create secret generic sdlc-platform-secret \
#     --from-literal=SDLC_DB_DSN='mysql://user:<URL编码后的密码>@host:3306/sdlc' \
#     --from-literal=SDLC_AGENT_API_KEY='<key>' \
#     --from-literal=SDLC_WRITE_TOKEN='<写防护令牌>' \
#     --from-literal=SDLC_FEISHU_APP_SECRET='<secret>'
# 推荐 create 不 apply：防本文件占位值与真值互相覆盖。
# ⚠ DSN 密码特殊字符必须 URL 百分号编码——parse_dsn 会做百分号解码，未编码会静默连错库/连不上。
apiVersion: v1
kind: Secret
metadata:
  name: sdlc-platform-secret
type: Opaque
stringData:
  SDLC_DB_DSN: "PLACEHOLDER-不可apply"
  SDLC_AGENT_API_KEY: "PLACEHOLDER-不可apply"
  SDLC_WRITE_TOKEN: "PLACEHOLDER-不可apply"
  SDLC_FEISHU_APP_SECRET: "PLACEHOLDER-不可apply"
