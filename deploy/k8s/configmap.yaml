# 非密配置（一次性 apply；改动后 rollout restart 生效：kubectl -n <ns> rollout restart deployment/sdlc-platform）。
# 密钥类在 sdlc-platform-secret（见同目录 secret.yaml 注释，走 kubectl create secret）。
# 字段权威来源：src/platform_sdlc/config.py（env 前缀 SDLC_）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdlc-platform-config
data:
  TZ: "Asia/Shanghai"
  # 文件面两根（单 PVC /data；绝对路径直解、程序不建目录——initContainer 负责）
  SDLC_MEDIA_DIR: "/data/media"
  SDLC_AGENT_WORKSPACE_ROOT: "/data/ws"
  # 技能仓（镜像内固化，构建期版本见 /opt/app/skills/REVISION）
  SDLC_AGENT_SKILLS_REPO: "/opt/app/skills"
  # 进程内任务执行通道（唯一通道）
  SDLC_AGENT_ENABLED: "true"
  SDLC_AGENT_TIMEOUT_MIN: "30"
  SDLC_GATE_TIMEOUT_MIN: "60"
  # OpenAI 兼容端点三元组之非密两元（API_KEY 走 Secret）
  SDLC_AGENT_BASE_URL: ""    # 上线填真实端点
  SDLC_AGENT_MODEL: ""       # 上线填真实模型名
  # 飞书应用（留空 = 无飞书能力：feishu_fetch 不注册/飞书源失败/白名单剔除三处联动）
  SDLC_FEISHU_APP_ID: ""
