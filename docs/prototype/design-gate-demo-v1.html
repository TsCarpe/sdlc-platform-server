<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计+门禁线上化 · 交互原型 v1</title>
<style>
/* ============ 平台设计语言子集（对齐 frontend/src/style.css） ============ */
:root{
  --canvas:#ffffff; --bg:#f6f7f9; --bg-soft:#fafbfc; --bg-active:#eef0f4;
  --line:#e4e7ec; --line-soft:#eef0f3; --line-strong:#cfd4dd;
  --ink-deep:#0f1320; --text:#191c24; --charcoal:#344054;
  --slate:#475467; --muted:#5d6b81; --stone:#667085; --faint:#8a94a6;
  --primary:#4f46e5; --primary-pressed:#4338ca;
  --blue:#4f46e5; --blue-light:#eef2ff; --blue-border:#d9ddfc;
  --yellow:#ffd02f; --yellow-light:#fff6d1; --yellow-dark:#7a5c00;
  --green:#067647; --green-vivid:#12b76a; --green-soft:#e5f4ee;
  --red:#d92d20; --red-deep:#b42318; --red-soft:#fdecea;
  --amber:#d97706; --amber-deep:#b54708; --amber-soft:#fcf1df;
  --lv-red:#f04438; --lv-yellow:#eaaa08; --lv-blue:#2e90fa;
  --teal:#0e9384; --teal-light:#e0f5f2;
  --shadow-card:rgba(16,24,40,.05) 0 1px 2px 0;
  --shadow-pop:rgba(16,24,40,.1) 0 4px 14px -2px;
  --shadow-modal:rgba(16,24,40,.18) 0 16px 44px -8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ============ demo 控制条（原型专属，非平台 UI） ============ */
.demo-bar{position:sticky;top:0;z-index:80;background:#171a26;color:#d5d9e4;padding:8px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.demo-bar .d-logo{font-weight:700;font-size:13px;color:#fff;display:flex;align-items:center;gap:7px;flex:none}
.demo-bar .d-logo i{width:10px;height:10px;border-radius:3px;background:var(--yellow);display:inline-block}
.demo-bar .d-tag{font-size:11px;background:#2a2f42;border-radius:9999px;padding:1px 9px;color:#9aa3bd}
.d-reset{border:1px solid #333a52;background:none;color:#9aa3bd;font-size:12px;padding:3px 10px;border-radius:7px}
.d-reset:hover{color:#fff;border-color:#58628a}
.demo-bar select{background:#222739;border:1px solid #333a52;border-radius:7px;color:#fff;padding:3px 9px;font-size:12px;min-width:200px}
.d-op{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa3bd;flex:none}
.d-op input{background:#222739;border:1px solid #333a52;border-radius:7px;color:#fff;padding:3px 9px;font-size:12px;width:90px}
.d-reset{border:1px solid #333a52;background:none;color:#9aa3bd;font-size:12px;padding:3px 10px;border-radius:7px}
.d-reset:hover{color:#fff;border-color:#58628a}

/* ============ 布局 ============ */
.topbar{background:var(--canvas);border-bottom:1px solid var(--line-soft);padding:0 36px 0 16px;height:54px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.topbar h1 .crumb{color:var(--faint);font-weight:500;margin:0 2px}
.topbar .sync-info{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-vivid);display:inline-block}
.content{padding:22px 36px 64px;max-width:1280px;margin:0 auto}

/* ============ 通用元件 ============ */
.card{background:var(--canvas);border:1px solid var(--line-soft);border-radius:12px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:10px;letter-spacing:-.1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:9999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.6}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-gray{background:#f2f4f7;color:var(--slate)}
.b-blue{background:var(--blue-light);color:var(--blue)}
.b-amber{background:var(--amber-soft);color:var(--amber-deep)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red-deep)}
.b-teal{background:var(--teal-light);color:var(--teal)}
.chip{font-size:11.5px;background:var(--canvas);border:1px solid var(--line);color:var(--slate);padding:1px 9px;border-radius:9999px;margin-right:5px;display:inline-block;line-height:1.7;white-space:nowrap}
.chip.real{color:var(--blue);border-color:transparent;background:var(--blue-light)}
.chip.warn{background:var(--red-soft);border-color:transparent;color:var(--red-deep)}
.chip.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.lock{background:var(--yellow-light);border-color:#f5e3a0;color:var(--yellow-dark);cursor:pointer}
.btn{border:1px solid var(--line-strong);background:var(--canvas);color:var(--text);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .13s}
.btn:hover{border-color:var(--faint);background:var(--bg-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-pressed)}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:#fff;cursor:not-allowed}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn.small{padding:3px 10px;font-size:12px}
.btn.link{border:none;background:none;color:var(--blue);padding:3px 6px;font-weight:500;border-radius:6px}
.btn.link:hover{background:var(--blue-light)}
.btn.danger{color:var(--red);border-color:#f2b8b3;background:var(--canvas)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:tpspin .9s linear infinite;flex:none}
@keyframes tpspin{to{transform:rotate(360deg)}}
.sub{font-size:12px;color:var(--muted)}
.err-t{color:var(--red)}

/* ============ 详情头 ============ */
.detail-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.detail-h h2{font-size:19px;font-weight:650;letter-spacing:-.2px;color:var(--ink-deep)}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:18px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:5px}

/* ============ Tabs ============ */
.tabs{display:flex;gap:2px;margin:14px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:54px;z-index:30;background:var(--bg);padding-top:6px}
.tab{padding:8px 14px 9px;background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:500;position:relative;white-space:nowrap;transition:color .13s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:600}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--blue);border-radius:2px}
.tab .n{font-size:11px;background:var(--bg-active);border-radius:9999px;padding:0 7px;margin-left:6px;color:var(--slate);font-weight:600;display:inline-block;line-height:1.7}
.tab.on .n{background:var(--blue-light);color:var(--blue)}

/* ============ TaskPanel v2（阶段点 3→5 + nextAction 唯一主按钮） ============ */
.taskpanel{margin:14px 0;border-left:3px solid var(--blue)}
.tp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tp-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tp-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tp-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tp-stages{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--slate)}
.tp-stage{display:inline-flex;align-items:center;gap:5px}
.st-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.st-dot.done{background:var(--green-vivid)}
.st-dot.failed{background:var(--red)}
.st-dot.doing{background:var(--blue)}
.st-dot.skip{background:var(--faint)}
.tp-lane{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--slate);flex-wrap:wrap;margin-top:8px}
.tp-task{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.tp-task .sub{max-width:55%}
.tp-task .sub.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-fail-body{flex-basis:100%;margin:6px 0 2px;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:6px}
.tp-fail-body .hint{font-size:12.5px;color:var(--red-deep);margin-bottom:4px}
.tp-fail-body .diag{font-size:11.5px;color:var(--slate);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;margin:0}
.tp-draft{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft)}
.tp-draft-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tp-btns{display:flex;gap:8px;margin-top:10px}
.tp-preview{max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:8px}
.tp-modes{display:flex;gap:6px;align-items:center;margin:8px 0 0}
.tp-modes .tp-on{background:var(--blue-light);border-color:var(--blue)}
.tp-editor{width:100%;min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;resize:vertical;background:#fff}

/* ============ banner ============ */
.banner{background:var(--bg-soft);border:1px solid var(--line-soft);color:var(--slate);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.65}
.banner.blue{background:var(--blue-light);border-color:var(--blue-border);color:#3f3ac0}
.banner.amber{background:var(--amber-soft);border-color:#f3ddb5;color:var(--amber-deep)}
.banner.red{background:var(--red-soft);border-color:#f2b8b3;color:var(--red-deep)}
.banner.green{background:var(--green-soft);border-color:#bfe3d2;color:var(--green)}
.banner b{font-weight:600}
.banner .sub{color:inherit;opacity:.75;font-size:12px}
.banner .b-act{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}

/* ============ 双 lane / 检查卡 / 角色卡 ============ */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.lanes{grid-template-columns:1fr}}
.lane{border:1px solid var(--line-soft);border-radius:10px;padding:13px 16px;background:var(--bg-soft)}
.lane h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.lane p{font-size:12.5px;color:var(--muted);line-height:1.65}
.gate-check{display:flex;flex-direction:column;gap:8px}
.gate-check .gc-item{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border:1px solid var(--line-soft);border-radius:9px;background:var(--canvas);font-size:13px}
.gc-ico{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.gc-ok .gc-ico{background:var(--green-soft);color:var(--green)}
.gc-no .gc-ico{background:var(--red-soft);color:var(--red)}
.gc-item .gc-t{font-weight:600}
.gc-item .gc-d{font-size:12px;color:var(--muted);margin-top:1px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role-card{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;background:var(--canvas)}
.role-card b{font-size:13px;display:flex;align-items:center;gap:7px}
.role-card p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.recon{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.recon .arr{color:var(--faint)}
.recon .box{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--canvas)}
.recon .box b{display:block;font-size:15px;letter-spacing:-.3px}
.recon .box span{font-size:11px;color:var(--muted)}
.recon .box.noise{opacity:.6;border-style:dashed}

/* ============ issue 卡 ============ */
.issue{border:1px solid var(--line-soft);border-left-width:3px;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:var(--canvas);box-shadow:var(--shadow-card)}
.issue.sev-red{border-left-color:var(--lv-red)}
.issue.sev-yellow{border-left-color:var(--lv-yellow)}
.issue.sev-blue{border-left-color:var(--lv-blue)}
.issue.decided{background:var(--bg-soft)}
.i-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.i-head .grow{flex:1}
.lvl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.lvl-dot.red{background:var(--lv-red)}.lvl-dot.yellow{background:var(--lv-yellow)}.lvl-dot.blue{background:var(--lv-blue)}
.issue .scene{font-weight:600;margin:7px 0 3px;font-size:13.5px;line-height:1.65}
.issue .loc{font-size:12px;color:var(--muted)}
.quote{background:var(--bg-soft);border-left:3px solid var(--line-strong);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12.5px;color:var(--slate);white-space:pre-wrap;line-height:1.7}
.quote .qlb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--stone);margin-bottom:4px;font-weight:600}
.reflink{color:var(--blue);cursor:pointer;border-bottom:1px dashed rgba(79,70,229,.4)}
.reflink:hover{background:var(--blue-light)}
.i-ops{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.i-verdict{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:8px;padding:7px 11px;font-size:12.5px;flex-wrap:wrap}
.grp-t{display:flex;align-items:center;gap:8px;padding:7px 0 8px;border-bottom:1px solid var(--line);margin:14px 0 10px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.grp-t:first-child{margin-top:0}
.grp-t .cnt{font-size:11.5px;color:var(--stone);font-weight:400;margin-left:auto}
.rev-card{border:1px solid var(--blue-border);background:var(--blue-light);border-radius:10px;padding:11px 14px;margin-bottom:10px}
.rev-card.done{border-color:#bfe3d2;background:var(--green-soft)}
.rev-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rev-diff{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;line-height:1.7}
.rev-diff .del{color:var(--red-deep);background:var(--red-soft);display:block;border-radius:4px;padding:0 4px}
.rev-diff .ins{color:var(--green);background:var(--green-soft);display:block;border-radius:4px;padding:0 4px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;font-size:13px;background:var(--canvas)}
.filters .spacer{flex:1}
.prog-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--bg-active);border-radius:9999px;overflow:hidden;flex:1;min-width:40px}
.bar-fill{height:100%;background:var(--green-vivid);border-radius:9999px;transition:width .3s}

/* ============ 文档视图 + 右栏目录 ============ */
.doc-layout{display:flex;gap:20px;align-items:flex-start}
.doc-layout>.card{flex:1;min-width:0}
.toc-side{flex:none;width:216px;position:sticky;top:120px;max-height:calc(100vh - 140px);display:flex;flex-direction:column;padding:10px 2px 10px 12px;border-left:1px solid var(--line-soft)}
.toc-side-t{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em}
.toc-side-list{overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:1px}
.toc-side-item{font-size:12px;line-height:1.5;color:var(--stone);cursor:pointer;padding:3px 8px;border-left:2px solid transparent;border-radius:0 6px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-side-item:hover{color:var(--text)}
.toc-side-item.lv1{font-weight:500;color:var(--charcoal)}
.doc{font-size:13.5px}
.doc h2{font-size:16px;font-weight:650;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
.doc h3{font-size:14px;font-weight:600;margin:15px 0 6px}
.doc p{margin:7px 0;line-height:1.75;color:var(--charcoal);max-width:76ch}
.doc ul{margin:7px 0 7px 20px;line-height:1.75}
.doc table{width:100%;border-collapse:collapse;margin:9px 0;font-size:12.5px}
.doc table th{background:var(--bg-soft);border:1px solid var(--line-soft);padding:6px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--muted)}
.doc table td{border:1px solid var(--line-soft);padding:6px 10px;line-height:1.65}
tr.locked-row td{background:var(--yellow-light)}
tr.locked-ok td{background:var(--green-soft)}
code{background:var(--bg-active);padding:1px 6px;border-radius:5px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.anchor-card{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-soft);padding:10px 14px;font-size:12.5px;color:var(--slate);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* ============ 用例 mini 表 ============ */
.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--canvas);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-card)}
.table th{background:var(--bg-soft);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.table tbody tr:last-child td{border-bottom:none}

/* ============ 弹窗 / 确认框 / toast ============ */
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.modal-mask{position:fixed;inset:0;background:rgba(15,18,30,.48);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;animation:fadein .18s ease}
.modal{background:var(--canvas);border-radius:14px;width:680px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow-modal);animation:pop .2s cubic-bezier(.21,1.02,.73,1)}
.modal.narrow{width:480px}
.modal-h{padding:13px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;font-weight:600;font-size:14px;gap:8px}
.modal-h .x{margin-left:auto;border:none;background:none;color:var(--muted);width:28px;height:28px;border-radius:7px}
.modal-h .x:hover{background:var(--bg-active)}
.modal-b{padding:18px 20px;overflow-y:auto;font-size:13px;color:var(--slate);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.modal-f{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;background:var(--bg-soft);border-radius:0 0 14px 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field label em{color:var(--red);font-style:normal;margin-right:2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;font-size:13px;background:var(--canvas)}
.field textarea{min-height:70px;resize:vertical}
/* 渠道选择卡片（提交需求弹窗，对齐真实平台 .seg） */
.seg{display:flex;gap:8px}
.seg-opt{flex:1;display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .13s, background .13s}
.seg-opt:hover{border-color:var(--line-strong)}
.seg-opt.on{border-color:var(--blue);background:var(--blue-light)}

function decisionSummary(st){

  const done = G.issues.filter(i=>i.dec).length + (st._offDone ?? (G.phase==='deciding'||G.phase==='released' ? Math.max(0, offscreen) : 0));

   ============================================================ */
const REF_RE = /(详述\d+(?:\.\d+)*|需求\.FR-\d+|体检\.P\d+|用例\.TC-\d+|确认\.Q-\d+|FR-\d+|TC-\d+|Q-\d+|\bF\d{2}\b|\bD\d\b|\b[XSWATW]-\d{2}\b)/g;
function lk(t){
  return String(t ?? '').replace(REF_RE, m=>{
    const ref = m.replace(/^(需求\.|体检\.|用例\.|确认\.)/, '');
    return `<span class="reflink" data-ref="${ref}" title="点击跳转定义源并溯源">${m}</span>`;
  });
}
function coveredBy(frId){ return S.cases.filter(c=>(c.pts||'').includes(frId)).map(c=>c.id); }
function resolveRef(ref){
  let m;
  if(m = ref.match(/^详述(\d+(?:\.\d+)*)$/))
    return {tab:'origin', anchor:'src-'+m[1].replace(/\./g,'-'), ref:'原文 '+ref,
      kv:[['定义源','原始需求快照（飞书块结构 · GR-1 冻结）'],['条款','详述'+m[1]],
          ['用途','质检 / 设计 / 澄清口径的定义源——引用此处即证明口径有出处']]};
  if(m = ref.match(/^FR-(\d+)$/)){
    const fr = FR_POINTS.find(x=>x.id===ref);
    if(!fr) return null;
    const cov = coveredBy(ref);
    return {tab:'digest', anchor:'fr-'+ref, ref:'需求.'+ref,
      kv:[['定义源','digest-20260929.md §7 需求点注册表（快照 v7 · GR-1 已冻结）'],['出处',fr.src],
          ['分组 / 模块',fr.grp+' / '+fr.mod],
          ['反向覆盖（RTM）', cov.length ? cov.map(c=>lk(c.id)).join('、') : '⚠ 0 条用例（dangling——正是 gate X-02 的分歧依据）']]};
  }
  if(m = ref.match(/^P(\d+)$/)){
    const au = AUDIT_ITEMS.find(x=>x.id===ref);
    if(!au) return null;
    return {tab:'audit', anchor:'audit-'+au.id, ref:'体检.'+au.id,
      kv:[['定义源','audit-20260929.md（26 项 · 已冻结）'],['严重度',au.sev==='red'?'🔴 阻断':au.sev==='yellow'?'🟡 严重':'🔵 建议'],
          ['问题',au.title],['去向',au.go]]};
  }
  if(m = ref.match(/^TC-(\d+)$/)){
    const c = S.cases.find(x=>x.id===ref);
    if(!c) return null;
    return {tab:'cases', anchor:'case-'+ref, ref:'用例.'+ref,
      kv:[['定义源','test_case（cases 注册表 · 全量替换语义）'],['标题',c.title],
          ['状态',c.st==='reviewed'?'已定稿':'待审核'],['覆盖需求点',c.pts||'—']]};
  }
  if(m = ref.match(/^Q-(\d+)$/)){
    const key = '确认.'+ref;
    return {tab:'design', anchor:'d-q'+m[1], ref: key,
      kv:[['定义源','design.md 头部 Q 表'],['当前假设','自动顺延 72 小时'],['阻塞范围','F05（不锁全局）'],
          ['拍板状态', S.design.locked[key] ? '已拍板' : '待拍板（锁定契约行）']]};
  }
  if(m = ref.match(/^F(\d{2})$/))
    return {tab:'design', anchor:'d-f'+m[1], ref:'功能.'+ref,
      kv:[['定义源','design.md §2 接口契约（挂 F 编号 + 口径来源）'],['可见性','契约行见跳转处']]};
  if(m = ref.match(/^D(\d)$/))
    return {tab:'design', anchor:'d-d'+m[1], ref:'设计.D'+m[1],
      kv:[['定义源','design.md §6 关键实现决策 D 表'],['决策',D_ROWS[m[1]]||'—'],
          ['接受条件', m[1]==='5' ? (S.design.d5ok?'压测 P99>500ms 则调整（gate 落改已补）':'未写（gate T-01 在审）') : '—']]};
  if(m = ref.match(/^([XSWATW])-(\d{2})$/)){
    const iss = (S.gate.issues||[]).find(i=>i.code===ref);
    if(!iss) return null;
    return {tab:'gate', anchor:'iss-'+ref, ref:'评审.'+ref,
      kv:[['定义源',`门禁 r${S.gate.round} issues（RECONCILE 汇总后裁决单元）`],['角色',iss.role],['主题',iss.theme],
          ['裁决状态', iss.dec ? iss.dec+'（'+(iss.by||'')+'）' : '待裁决']]};
  }
  return null;
}
function openRef(ref){
  const t = resolveRef(ref);

  S.refTrace = t; S.view = 'detail'; S.tab = t.tab;

}

function liveNodes(){
  const D=S.design, G=S.gate;
  const reviewed=S.cases.filter(c=>c.st==='reviewed').length;
  const dsg = D.phase==='final'?'done':D.phase==='running'?'doing':D.phase==='failed'?'failed':(D.phase==='draft')?'doing':(D.phase==='skipped')?'skip':'todo';
  const caseN = reviewed===S.cases.length?'done':reviewed>0?'doing':'todo';
  const gate = G.phase==='released'?'done':(G.phase==='running'||G.phase==='summary'||G.phase==='deciding')?'doing':(G.phase==='blocked')?'doing':'todo';
  return [['质检','done'],['澄清','done'],['发布','done'],['设计',dsg],['用例',caseN],['门禁',gate],['放行',G.phase==='released'?'done':'todo']];
}
function nodeStrip(nodes){
  return `<div class="node-strip">${nodes.map(([t,stt],i)=>

}

function nextAction(){
  const D=S.design, G=S.gate, r=S.req;
  const busyTask = D.phase==='running';
  if(busyTask) return null;
  if(D.phase==='none' && !r.targetRepo) return {label:'配置目标代码仓', act:'config-repo'};
  if(D.phase==='none' && r.riskTier==='C') return {label:'声明轻量跳过（C 级）', act:'declare-skip'};
  if(D.phase==='none') return {label:'生成技术设计', act:'gen-design'};
  if(D.phase==='draft') return {label:'设计定稿（确认点②）', act:'finalize-design'};
  if(D.phase==='skipped' || D.phase==='final'){
    if(G.phase==='none'||G.phase==='blocked'){
      const chk = gateChecks();
      return chk.every(c=>c.ok) ? {label:'开评审（'+(r.riskTier==='C'?'自查档':(r.riskTier==='A'?'4 角色扇出':'2 角色扇出'))+'）', act:'open-gate'}
                                : {label:'开评审', act:'open-gate', disabled:true, why:chk.filter(c=>!c.ok).map(c=>c.t).join('；')};
    }
    if(G.phase==='summary') return {label:'进入裁决', act:'to-deciding'};
    if(G.phase==='deciding'){
      const s = decisionSummary(S);
      if(s && s.done>=s.total) return {label:'校验并放行', act:'open-release'};
      return {label:`继续裁决 ${s.done}/${s.total}`, act:'goto-deciding'};
    }
  }
  return null;
}

function grpWrap(key, title, items, rowFn, head){
  const open = !!S.openGrps[key];
  const body = head
    ? `<table class="table" style="margin-top:6px"><thead>${head}</thead><tbody>${items.map(rowFn).join('')}</tbody></table>`
    : `<div style="margin-top:6px">${items.map(rowFn).join('')}</div>`;
  return `<div style="margin-bottom:12px">
    <div class="grp-t" data-act="grp" data-arg="${key}" style="cursor:pointer;user-select:none"><span style="color:var(--faint);margin-right:4px;display:inline-block;transition:transform .18s;transform:${open?'rotate(90deg)':''}">▶</span>${esc(title)}<span class="cnt" style="margin-left:8px;font-size:11.5px;color:var(--stone);font-weight:400">${items.length} 条</span></div>
    ${open?body:''}
  </div>`;
}

function allGrpKeys(p){

}

function clrItem(c){
  let ans;
  if(c.status==='pending'){
    ans = `<div class="ans" style="margin-top:10px"><span class="lb warn">待答复</span>
      <textarea data-clf="${c.seq}" placeholder="PM 在此作答…（失焦自动保存）" style="width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;font-size:13px;margin-top:5px;min-height:48px;resize:vertical">${esc(c.answer||'')}</textarea>
      <div style="display:flex;gap:14px;margin-top:6px">
        <button class="btn small link" data-act="dispose-open" data-arg="${c.seq}:rejected">驳回（不是问题）</button>
        <button class="btn small link" data-act="dispose-open" data-arg="${c.seq}:deferred">挂起（转遗留假设）</button>
      </div></div>`;
  } else if(c.status==='rejected' || c.status==='deferred'){
    ans = `<div class="ans" style="margin-top:10px"><span class="lb">${c.status==='rejected'?'已驳回（不是问题，不进定稿）':'已挂起（转遗留假设 需求.Axx）'}</span>
      <span class="sub">${esc(c.note||'')}</span>
      <button class="btn small link" data-act="reopen-clr" data-arg="${c.seq}" style="margin-left:8px">重新作答</button></div>`;
  } else {
    ans = `<div class="ans" style="margin-top:10px"><span class="lb">答复</span>${esc(c.answer||'')}
      <button class="btn small link" data-act="reopen-clr" data-arg="${c.seq}" style="margin-left:8px">重新作答</button></div>`;
  }
  return `<div class="check-item ${c.level}" id="clr-${c.seq}" style="background:var(--canvas)">
    <div class="i-head"><span class="lvl-dot ${c.level}"></span><b>${c.seq}</b><span class="chip">${esc(c.theme)}</span>
      <button class="btn small link" data-act="jump-audit" data-arg="${c.seq}">来自体检.${c.seq} ↗</button><span class="grow"></span></div>
    <div class="scene">${esc(c.question)}</div>

    <div class="quote"><span class="qlb">原文摘引 · <span class="reflink" data-ref="${c.ctx}">在快照中定位</span></span>${lk(esc(c.quote))}</div>
    ${ans}</div>`;
}

    </div>`;
  }
  if(D.phase==='running'){
    return head + `
    <div class="card anim"><h3><span class="spin"></span> 技术设计生成中（design_gen · agentscope-inproc · 已 6 分钟）</h3>
      <div style="margin:6px 0 12px">
        ${dstep('done','Step 1 前置闸三道 + 输入定位',
          'Q 表硬阻塞 1 项（确认.Q-03 → 只锁 F05 行，不锁全局，契约行按「当前假设」产出）；风险分级已拍板（'+S.req.riskTier+'）；输入锚点三件套就位（GR-1 冻结）；项目规范源 dev_standards/ 已读')}
        ${dstep('run','Step 2 存量勘察（目标仓 '+esc(S.req.targetRepo||'—')+'）',
          'works/works_log/signup 表结构 ✓ ｜ WorksStatusEnum 引用扫描 ⟳ —— 发现被 3 个存量模块消费、works 表被报表系统直读，影响面证据已产出升级提案（见下方卡片）')}
        ${dstep('todo','Step 3 按 design-template 产出 design.md（'+(S.req.riskTier==='A'?'A 级全量':'B 级 mini')+'）','')}
        ${dstep('todo','Step 4 齐套自检（六项，漏项即返工）','')}
        ${dstep('todo','Step 5 落草稿 + 暂停等确认点②定稿','产物走 put_draft(type=design)；正式落盘只能由人采纳')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-act="sim-design-done">模拟：任务完成，草稿回传 →</button>
        <button class="btn danger" data-act="sim-design-fail">模拟：任务失败</button>
        <button class="btn" data-act="cancel-design">取消任务</button>
      </div></div>
    ${tierProposalHtml()}`;
  }
  if(D.phase==='failed'){
    return head + `<div class="card anim"><h3><span class="badge b-red">失败</span> 技术设计生成</h3>
      <p class="sub err-t">read_file：目标仓路径不可达（ENOENT）</p>
      <pre class="tp-fail-body" style="margin-top:8px"><p class="hint">检查「目标代码仓」配置与本机权限，修正后重试</p><pre class="diag">AgentPlatformTools.read_file: resolve ${esc(r.targetRepo)} → ENOENT</pre></pre>
      <div style="margin-top:10px;display:flex;gap:8px"><button class="btn primary" data-act="retry-design">重试</button>
      <button class="btn" data-act="config-repo">修正目标仓配置</button></div></div>`;
  }
  if(D.phase==='draft'){
    return head + anchorPanel() + draftCard() + tierProposalHtml();
  }
  if(D.phase==='final'){
    return head + anchorPanel() + `
    <div class="anchor-card anim"><span class="badge b-green">已定稿</span>
      <span>定稿人 ${esc(D.final.by)} · ${D.final.at} · v${D.final.ver}</span>
      <span class="sub">确认点②已过；放行唯一口径 = 门禁已放行（GR-4）</span>
      <button class="btn small primary" data-act="view-final">${D.showDoc?'收起文档':'查看定稿文档（全量九节）'}</button>
      ${S.gate.phase==='released'?'':`<span class="sub" style="margin-left:auto">如需修改：评审中走「落改」通道；未开审/已放行后的实质变更将触发重审提示（GR-3）</span>`}
    </div>
    ${D.showDoc?`<div class="card anim"><div class="doc-layout"><div class="card tp-preview" style="max-height:560px"><div class="doc">${designDocHtml(S)}</div></div>
      <div class="toc-side"><div class="toc-side-t">目录</div><div class="toc-side-list">
        ${DOC_TOC.map(([id,t,lv])=>`<a class="toc-side-item lv${lv}" data-act="toc" data-arg="${id}">${t}</a>`).join('')}
      </div></div></div></div>`:''}`;
  }
  if(D.phase==='skipped'){
    return head + `<div class="card anim"><h3><span class="badge b-gray">轻量跳过</span></h3>
      <p class="sub">C 级声明留痕：${op()} · ${now()}。开闸条件①以「已声明轻量跳过」满足，门禁以自查档执行。</p></div>`;
  }
  return head;
}

/* ---------- 用例 tab（双来源语义 + 筛选/排序 + caseNo + 详情弹层入口） ---------- */
function casesTab(){
  const f=S.caseFilter, q=S.caseQ.trim();
  let list=[...S.cases];
  if(f!=='all') list=list.filter(c=>c.st===f);
  if(q) list=list.filter(c=>(c.title+' '+c.id).includes(q));
  const k=S.caseSortKey, dir=S.caseSortDir==='asc'?1:-1;
  if(k) list.sort((a,b)=>{ const x=k==='id'?(a.caseNo??a.id):(a[k]??''), y=k==='id'?(b.caseNo??b.id):(b[k]??'');
    return (typeof x==='number'? x-y : String(x).localeCompare(String(y)))*dir; });
  const reviewed=S.cases.filter(c=>c.st==='reviewed').length;
  const sortTh=(key,label,w)=>`<th data-act="case-sort" data-arg="${key}" style="cursor:pointer;user-select:none;${w?'width:'+w:''}">${label}${S.caseSortKey===key?(S.caseSortDir==='asc'?' ↑':' ↓'):''}</th>`;
  return `
  <div class="banner blue"><b>用例 lane</b><span class="sub">双来源：sdlc-test 推送 = 平台只读 + 评论反馈维护人；表单提交 = 提交人可编辑。定稿是开闸前置（GR-2②）；门禁放行也会自动置定稿（标注来源，GR-4 联动）。</span></div>
  <div class="card">
    <h3>测试用例（${S.cases.length}）<span class="badge ${reviewed===S.cases.length?'b-green':'b-amber'}">${reviewed}/${S.cases.length} 已定稿</span>
      <span style="flex:1"></span>
      <button class="btn small primary" data-act="case-form-open">+ 表单提交用例</button>
      <button class="btn small" data-act="bulk-review" ${reviewed===S.cases.length?'disabled':''}>一键定稿未定稿项</button>
    </h3>
    <div class="filters">
      <select data-act-change="case-filter">
        <option value="all" ${f==='all'?'selected':''}>全部状态</option>
        <option value="draft" ${f==='draft'?'selected':''}>待审核</option>
        <option value="reviewed" ${f==='reviewed'?'selected':''}>已定稿</option>
      </select>
      <input data-act-change="case-q" value="${esc(S.caseQ)}" placeholder="搜索用例标题…" style="width:200px">
    </div>
    <table class="table"><thead><tr>
      ${sortTh('id','编号','108px')}<th>标题</th><th style="width:180px">关联需求点</th>
      ${sortTh('pri','优先级','66px')}${sortTh('st','审核状态','92px')}
      <th style="width:96px">来源人</th><th style="width:92px">来源工具</th><th style="width:150px">操作</th></tr></thead><tbody>
      ${list.map(c=>`<tr data-act="case-open" data-arg="${c.id}" style="cursor:pointer">
        <td class="sub"><div>${c.id}</div><div style="font-size:11px;color:var(--faint)" title="全局登记序号（跨需求唯一，口头可引用）">#${c.caseNo}</div></td>
        <td>${esc(c.title)}</td>
        <td class="sub">${lk(esc(c.pts))||'—'}</td>
        <td><span class="badge ${c.pri==='P0'?'b-red':c.pri==='P1'?'b-amber':'b-gray'}">${c.pri}</span></td>
        <td>${c.st==='reviewed'
          ?`<span class="badge b-green">已定稿</span>${c.src?`<div style="font-size:11px;color:var(--muted)">${esc(c.src)}</div>`:''}`
          :'<span class="badge b-gray">待审核</span>'}</td>
        <td class="sub">${esc(c.owner)}</td>
        <td class="sub">${esc(c.tool)}</td>
        <td>${c.st==='reviewed'
          ?`<button class="btn small" data-act="case-unreview" data-arg="${c.id}">退回</button>`
          :`<button class="btn small primary" data-act="case-review" data-arg="${c.id}">定稿</button>`}
          <button class="btn small link" data-act="case-open" data-arg="${c.id}">详情</button></td>
      </tr>`).join('')}
      ${!list.length?'<tr><td colspan="8"><div class="empty">当前筛选条件下没有用例</div></td></tr>':''}
    </tbody></table>
    ${S.gate.phase==='deciding'?'<div class="banner amber" style="margin:10px 0 0"><b>评审进行中</b><span class="sub">此刻退回/修改用例属于评审中变更——走「落改」通道，或人工「作废重审」（GR-3 窗口限定）。</span></div>':''}

/* ---------- 门禁 tab ---------- */
function gateChecks(){
  const D=S.design;
  const reviewed = S.cases.filter(c=>c.st==='reviewed').length;
  return [
    {t:'设计已定稿 ∨ 轻量跳过', ok: D.phase==='final'||D.phase==='skipped',
     d: D.phase==='final'?`已定稿 v${D.final.ver}（${D.final.by}）`:D.phase==='skipped'?'已声明轻量跳过（C 级）':'设计 lane 未完成',
     goto:'design'},
    {t:'用例 ≥1 且全部定稿', ok: S.cases.length>0 && reviewed===S.cases.length,
     d:`${reviewed}/${S.cases.length} 已定稿`, goto:'cases'},
    {t:'FR 覆盖检查（RTM）', ok:true, d:'正向 26/26 · 反向无 dangling', goto:''},
  ];
}

function gateTab(){
  const G = S.gate, r = S.req;
  const head = `<div class="banner blue"><b>门禁 lane</b><span class="sub">分档对抗评审（A=4 独立子代理 / B=2 / C=自查） → RECONCILE 汇总 → 人逐条裁决 → 放行（GR-4）。放行 = 权威登记，开发侧仍由 guard_dev 机械拦截（平台口径唯一，guard_dev 改读平台 API）。</span></div>`;

  if(G.phase==='none'){
    if(D_none()) return head + `<div class="card"><h3>尚未开闸</h3><div class="empty">完成设计 lane（或声明轻量跳过）后，这里会出现开闸检查。</div></div>`;
    return head + gateCheckCard();
  }
  if(G.phase==='blocked') return head + gateCheckCard();
  if(G.phase==='running') return head + runningHtml();
  if(G.phase==='summary') return head + reconcileHtml();
  if(G.phase==='deciding') return head + releaseBannerHtml() + decidingHtml();
  if(G.phase==='released') return head + releasedHtml();
  return head;
}
function D_none(){ return S.design.phase!=='final' && S.design.phase!=='skipped'; }

function gateCheckCard(){
  const chk = gateChecks();
  const allOk = chk.every(c=>c.ok);
  return `
  <div class="card anim"><h3>开闸检查（GR-2 三条件）</h3>
    <div class="gate-check">
      ${chk.map((c,i)=>`<div class="gc-item ${c.ok?'gc-ok':'gc-no'}">
        <span class="gc-ico">${c.ok?'✓':'✗'}</span>
        <div style="flex:1"><div class="gc-t">${c.t}</div><div class="gc-d">${c.d}</div></div>
        ${!c.ok&&c.goto?`<button class="btn small" data-act="tab" data-arg="${c.goto}">去处理 →</button>`:''}
      </div>`).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button class="btn primary" data-act="open-gate" ${allOk?'':'disabled'} title="${allOk?'':chk.filter(c=>!c.ok).map(c=>c.t).join('；')}">开评审（${S.req.riskTier==='C'?'C 级自查档':(S.req.riskTier==='A'?'A 级 · 4 角色扇出':'B 级 · 2 角色扇出')}）</button>

}

  return `<div class="issue sev-${i.sev} ${decided?'decided':''}" id="iss-${i.code}">
    <div class="i-head">
      <span class="lvl-dot ${i.sev}"></span><b>${i.code}</b>
      ${i.div?'<span class="badge b-red">分歧单元</span>':''}
      <span class="chip">${esc(i.theme)}</span><span class="chip">${esc(i.role)}</span>
      <span class="chip ${i.basis==='hard'?'warn':''}">${i.basis==='hard'?'硬依据':'软依据'}</span>
      ${i.lockedQ?`<span class="chip lock" data-act="open-q">${esc(i.lockedQ)}</span>`:''}
      <span class="grow"></span>
      ${decided?`<span class="badge ${i.dec==='落改'?'b-blue':i.dec==='驳回'?'b-gray':'b-amber'}">${i.dec}</span>`:''}
    </div>
    <div class="scene">${lk(esc(i.scene))}</div>
    <details ${i.div?'open':''}><summary class="sub" style="cursor:pointer">原文摘引 / 位置</summary>
      <div class="quote"><span class="qlb">原文摘引</span>${lk(esc(i.quote))}</div></details>
    <div class="loc" style="margin-top:6px">落点：${lk(esc(i.loc))}</div>
    ${decided
      ?`<div class="i-verdict"><span class="badge ${i.dec==='落改'?'b-blue':i.dec==='驳回'?'b-gray':'b-amber'}">${i.dec}</span>
          <span>${esc(i.by||op())} · ${esc(i.note||'')}</span>
          ${i.dec==='落改'?'<span class="chip ok">修订工作项已关联 →</span>':''}
          ${readonly?'':'<button class="btn small link" data-act="re-decide" data-arg="'+i.code+'">改判</button>'}</div>`
      :(readonly
        ?'<div class="i-verdict"><span class="badge b-amber">待裁决</span></div>'
        :`<div class="i-ops">
            <button class="btn small primary" data-act="dec" data-arg="${i.code}:落改">落改</button>
            <button class="btn small" data-act="dec" data-arg="${i.code}:驳回">驳回</button>

          </div>`)}
  </div>`;
}

function decidingHtml(){
  const G = S.gate;
  const f = G.filter||'all';
  const s = decisionSummary(S);
  const divs = G.issues.filter(i=>i.div);
  const rest = G.issues.filter(i=>!i.div);
  const match = i => f==='all' || (f==='todo'?!i.dec:!!i.dec);
  const unreviewed = G.issues.filter(i=>!i.dec && i.suggest);
  const doubts = G.issues.filter(i=>i.dec==='存疑');
  return `
  ${doubtPanel(doubts)}
  ${revPanel()}
  <div class="card anim">
    <h3>裁决（r${G.round}）<span class="badge ${s.done>=s.total?'b-green':'b-amber'}">${s.done}/${s.total}</span>
      <span style="flex:1"></span>
      <span class="prog-row" style="width:220px"><span class="bar"><span class="bar-fill" style="width:${Math.round(s.done/s.total*100)}%"></span></span></span>
    </h3>
    <div class="filters">
      <select data-act-change="gate-filter">
        <option value="all" ${f==='all'?'selected':''}>全部</option>
        <option value="todo" ${f==='todo'?'selected':''}>待裁决</option>

/* ---------- 放行 / 已放行 ---------- */
let relCtx = null;
function releaseChecklist(){
  const s = decisionSummary(S);
  const revsPending = S.gate.revs.filter(r=>r.status!=='已执行');
  return [
    {t:`全部裁决（${s.done}/${s.total}）`, ok:s.done>=s.total},
    {t:`落改闭环：修订工作项全部已执行（${S.gate.revs.filter(r=>r.status==='已执行').length}/${S.gate.revs.length}）`, ok:revsPending.length===0, pend:revsPending.map(r=>r.id)},
    {t:'引用可达（命名空间引用一跳定位）', ok:true},
    {t:'计数同源（速览 ↔ 明细）', ok:true},
    {t:'FR 覆盖率 100%（RTM 正向 26/26）', ok:true},
    {t:'场景列非空（白话可裁决）', ok:true},
  ];
}
function openReleaseModal(){
  const list = releaseChecklist();
  const allOk = list.every(c=>c.ok);
  relCtx = {list, allOk};
  renderModal({type:'release'});
}

      const by=document.getElementById('f-by').value.trim();
      if(!by){ toast('定稿人必填（归因红线）', true); return; }
      if(boxes.some(b=>b.disabled)){ toast('「锁定待拍板」行未拍板——先回文档处理 确认.Q-03', true); return; }
      if(!boxes.every(b=>b.checked)){ toast('齐套自检六项须全部勾选（漏项即返工）', true); return; }
      D.phase='final'; D.final={by, at:now(), ver:(D.final?.ver||0)+1};
      log(st,`设计定稿（确认点②）v${D.final.ver} · 齐套自检六项全过 · 定稿人 ${by}`); closeModal(); toast('设计已定稿——放行仍需门禁评审'); },
  };
  if(act==='gate-filter'){ G.filter = e.target.value; render(); return; }
  if(A[act]){ A[act](); render(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  const host=t.closest ? t.closest('[data-act-change]') : null;
  if(host){
    const act=host.dataset.actChange;
    if(act==='gate-filter'){ S.gate.filter=t.value; render(); }
    else if(act==='clf-filter'){ S.clfFilter=t.value; render(); }
    else if(act==='case-filter'){ S.caseFilter=t.value; render(); }
    else if(act==='case-q'){ S.caseQ=t.value; render(); }
  }
  const clf=t.closest ? t.closest('[data-clf]') : null;
  if(clf){
    const c=S.clarify.find(x=>x.seq===clf.dataset.clf);
    if(c){ const v=t.value.trim();
      if((c.answer||'')===v) return;
      c.answer=v; c.status = v?'answered':'pending';
      log(S, `澄清 ${c.seq} ${v?'作答':'撤销答复'}（失焦自动保存）`); render(); toast(`已保存 ${c.seq}`); }
  }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
    const b=document.querySelector('[data-act="cmt-add"]'); if(b) b.click();
  }
});
document.getElementById('d-scen-select').addEventListener('change', e=>{
  closeModal(); const v=S.view; S=freshState(e.target.value); S.view=v; render();
});
render();
</script>
</body>
