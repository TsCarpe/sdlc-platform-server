<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计+门禁线上化 · 交互原型 v2（迭代×需求 1:1 全流程）</title>
<style>
/* ============ 平台设计语言子集（对齐 frontend/src/style.css） ============ */
:root{
  --canvas:#ffffff; --bg:#f6f7f9; --bg-soft:#fafbfc; --bg-active:#eef0f4;
  --line:#e4e7ec; --line-soft:#eef0f3; --line-strong:#cfd4dd;
  --ink-deep:#0f1320; --text:#191c24; --charcoal:#344054;
  --slate:#475467; --muted:#5d6b81; --stone:#667085; --faint:#8a94a6;
  --primary:#4f46e5; --primary-pressed:#4338ca;
  --blue:#4f46e5; --blue-light:#eef2ff; --blue-border:#d9ddfc;
  --yellow:#ffd02f; --yellow-light:#fff6d1; --yellow-dark:#7a5c00;
  --green:#067647; --green-vivid:#12b76a; --green-soft:#e5f4ee;
  --red:#d92d20; --red-deep:#b42318; --red-soft:#fdecea;
  --amber:#d97706; --amber-deep:#b54708; --amber-soft:#fcf1df;
  --lv-red:#f04438; --lv-yellow:#eaaa08; --lv-blue:#2e90fa;
  --teal:#0e9384; --teal-light:#e0f5f2;
  --shadow-card:rgba(16,24,40,.05) 0 1px 2px 0;
  --shadow-pop:rgba(16,24,40,.1) 0 4px 14px -2px;
  --shadow-modal:rgba(16,24,40,.18) 0 16px 44px -8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ============ demo 控制条（原型专属，非平台 UI） ============ */
.demo-bar{position:sticky;top:0;z-index:80;background:#171a26;color:#d5d9e4;padding:8px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.demo-bar .d-logo{font-weight:700;font-size:13px;color:#fff;display:flex;align-items:center;gap:7px;flex:none}
.demo-bar .d-logo i{width:10px;height:10px;border-radius:3px;background:var(--yellow);display:inline-block}
.demo-bar .d-tag{font-size:11px;background:#2a2f42;border-radius:9999px;padding:1px 9px;color:#9aa3bd}
.d-reset{border:1px solid #333a52;background:none;color:#9aa3bd;font-size:12px;padding:3px 10px;border-radius:7px}
.d-reset:hover{color:#fff;border-color:#58628a}
.demo-bar select{background:#222739;border:1px solid #333a52;border-radius:7px;color:#fff;padding:3px 9px;font-size:12px;min-width:200px}
.d-op{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa3bd;flex:none}
.d-op input{background:#222739;border:1px solid #333a52;border-radius:7px;color:#fff;padding:3px 9px;font-size:12px;width:90px}
.d-reset{border:1px solid #333a52;background:none;color:#9aa3bd;font-size:12px;padding:3px 10px;border-radius:7px}
.d-reset:hover{color:#fff;border-color:#58628a}

/* ============ 布局 ============ */
.topbar{background:var(--canvas);border-bottom:1px solid var(--line-soft);padding:0 36px 0 16px;height:54px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.topbar h1 .crumb{color:var(--faint);font-weight:500;margin:0 2px}
.topbar .sync-info{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topbar select{border:1px solid var(--line-strong);border-radius:8px;background:var(--canvas);color:var(--text);padding:4px 10px;font-size:12.5px;max-width:300px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-vivid);display:inline-block}
.content{padding:22px 36px 64px;max-width:1280px;margin:0 auto}

/* ============ 通用元件 ============ */
.card{background:var(--canvas);border:1px solid var(--line-soft);border-radius:12px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:10px;letter-spacing:-.1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:9999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.6}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-gray{background:#f2f4f7;color:var(--slate)}
.b-blue{background:var(--blue-light);color:var(--blue)}
.b-amber{background:var(--amber-soft);color:var(--amber-deep)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red-deep)}
.b-teal{background:var(--teal-light);color:var(--teal)}
.chip{font-size:11.5px;background:var(--canvas);border:1px solid var(--line);color:var(--slate);padding:1px 9px;border-radius:9999px;margin-right:5px;display:inline-block;line-height:1.7;white-space:nowrap}
.chip.real{color:var(--blue);border-color:transparent;background:var(--blue-light)}
.chip.warn{background:var(--red-soft);border-color:transparent;color:var(--red-deep)}
.chip.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.lock{background:var(--yellow-light);border-color:#f5e3a0;color:var(--yellow-dark);cursor:pointer}
tr.locked-row td{background:var(--yellow-light)}
tr.locked-ok td{background:var(--green-soft)}
.btn{border:1px solid var(--line-strong);background:var(--canvas);color:var(--text);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .13s}
.btn:hover{border-color:var(--faint);background:var(--bg-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-pressed)}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:#fff;cursor:not-allowed}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn.small{padding:3px 10px;font-size:12px}
.btn.link{border:none;background:none;color:var(--blue);padding:3px 6px;font-weight:500;border-radius:6px}
.btn.link:hover{background:var(--blue-light)}
.btn.danger{color:var(--red);border-color:#f2b8b3;background:var(--canvas)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:tpspin .9s linear infinite;flex:none}
@keyframes tpspin{to{transform:rotate(360deg)}}
.sub{font-size:12px;color:var(--muted)}
.err-t{color:var(--red)}

/* ============ 详情头 ============ */
.detail-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.detail-h h2{font-size:19px;font-weight:650;letter-spacing:-.2px;color:var(--ink-deep)}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:18px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:5px}

/* ============ Tabs ============ */
.tabs{display:flex;gap:2px;margin:14px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:54px;z-index:30;background:var(--bg);padding-top:6px}
.tab{padding:8px 14px 9px;background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:500;position:relative;white-space:nowrap;transition:color .13s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:600}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--blue);border-radius:2px}
.tab .n{font-size:11px;background:var(--bg-active);border-radius:9999px;padding:0 7px;margin-left:6px;color:var(--slate);font-weight:600;display:inline-block;line-height:1.7}
.tab.on .n{background:var(--blue-light);color:var(--blue)}

/* ============ TaskPanel v2（阶段点 3→5 + nextAction 唯一主按钮） ============ */
.taskpanel{margin:14px 0;border-left:3px solid var(--blue)}
.tp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tp-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tp-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tp-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tp-stages{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--slate)}
.tp-stage{display:inline-flex;align-items:center;gap:5px}
.st-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.st-dot.done{background:var(--green-vivid)}
.st-dot.failed{background:var(--red)}
.st-dot.doing{background:var(--blue)}
.st-dot.skip{background:var(--faint)}
.tp-lane{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--slate);flex-wrap:wrap;margin-top:8px}
.tp-task{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.tp-task .sub{max-width:55%}
.tp-task .sub.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-fail-body{flex-basis:100%;margin:6px 0 2px;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:6px}
.tp-fail-body .hint{font-size:12.5px;color:var(--red-deep);margin-bottom:4px}
.tp-fail-body .diag{font-size:11.5px;color:var(--slate);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;margin:0}
.tp-draft{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft)}
.tp-draft-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tp-btns{display:flex;gap:8px;margin-top:10px}
.tp-preview{max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:8px}
.tp-modes{display:flex;gap:6px;align-items:center;margin:8px 0 0}
.tp-modes .tp-on{background:var(--blue-light);border-color:var(--blue)}
.tp-editor{width:100%;min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;resize:vertical;background:#fff}

/* ============ banner ============ */
.banner{background:var(--bg-soft);border:1px solid var(--line-soft);color:var(--slate);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.65}
.banner.blue{background:var(--blue-light);border-color:var(--blue-border);color:#3f3ac0}
.banner.amber{background:var(--amber-soft);border-color:#f3ddb5;color:var(--amber-deep)}
.banner.red{background:var(--red-soft);border-color:#f2b8b3;color:var(--red-deep)}
.banner.green{background:var(--green-soft);border-color:#bfe3d2;color:var(--green)}
.banner b{font-weight:600}
.banner .sub{color:inherit;opacity:.75;font-size:12px}
.banner .b-act{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}

/* ============ 双 lane / 检查卡 / 角色卡 ============ */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.lanes{grid-template-columns:1fr}}
.lane{border:1px solid var(--line-soft);border-radius:10px;padding:13px 16px;background:var(--bg-soft)}
.lane h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.lane p{font-size:12.5px;color:var(--muted);line-height:1.65}
.gate-check{display:flex;flex-direction:column;gap:8px}
.gate-check .gc-item{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border:1px solid var(--line-soft);border-radius:9px;background:var(--canvas);font-size:13px}
.gc-ico{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.gc-ok .gc-ico{background:var(--green-soft);color:var(--green)}
.gc-no .gc-ico{background:var(--red-soft);color:var(--red)}
.gc-item .gc-t{font-weight:600}
.gc-item .gc-d{font-size:12px;color:var(--muted);margin-top:1px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role-card{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;background:var(--canvas)}
.role-card b{font-size:13px;display:flex;align-items:center;gap:7px}
.role-card p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.recon{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.recon .arr{color:var(--faint)}
.recon .box{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--canvas)}
.recon .box b{display:block;font-size:15px;letter-spacing:-.3px}
.recon .box span{font-size:11px;color:var(--muted)}
.recon .box.noise{opacity:.6;border-style:dashed}

/* ============ issue 卡 ============ */
.issue{border:1px solid var(--line-soft);border-left-width:3px;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:var(--canvas);box-shadow:var(--shadow-card)}
.issue.sev-red{border-left-color:var(--lv-red)}
.issue.sev-yellow{border-left-color:var(--lv-yellow)}
.issue.sev-blue{border-left-color:var(--lv-blue)}
.issue.decided{background:var(--bg-soft)}
.i-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.i-head .grow{flex:1}
.lvl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.lvl-dot.red{background:var(--lv-red)}.lvl-dot.yellow{background:var(--lv-yellow)}.lvl-dot.blue{background:var(--lv-blue)}
.issue .scene{font-weight:600;margin:7px 0 3px;font-size:13.5px;line-height:1.65}
.issue .loc{font-size:12px;color:var(--muted)}
.quote{background:var(--bg-soft);border-left:3px solid var(--line-strong);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12.5px;color:var(--slate);white-space:pre-wrap;line-height:1.7}
.quote .qlb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--stone);margin-bottom:4px;font-weight:600}
.reflink{color:var(--blue);cursor:pointer;border-bottom:1px dashed rgba(79,70,229,.4)}
.reflink:hover{background:var(--blue-light)}
.i-ops{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.i-verdict{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:8px;padding:7px 11px;font-size:12.5px;flex-wrap:wrap}
.grp-t{display:flex;align-items:center;gap:8px;padding:7px 0 8px;border-bottom:1px solid var(--line);margin:14px 0 10px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.grp-t:first-child{margin-top:0}
.grp-t .cnt{font-size:11.5px;color:var(--stone);font-weight:400;margin-left:auto}
.rev-card{border:1px solid var(--blue-border);background:var(--blue-light);border-radius:10px;padding:11px 14px;margin-bottom:10px}
.rev-card.done{border-color:#bfe3d2;background:var(--green-soft)}
.rev-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rev-diff{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;line-height:1.7}
.rev-diff .del{color:var(--red-deep);background:var(--red-soft);display:block;border-radius:4px;padding:0 4px}
.rev-diff .ins{color:var(--green);background:var(--green-soft);display:block;border-radius:4px;padding:0 4px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;font-size:13px;background:var(--canvas)}
.filters .spacer{flex:1}
.prog-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--bg-active);border-radius:9999px;overflow:hidden;flex:1;min-width:40px}
.bar-fill{height:100%;background:var(--green-vivid);border-radius:9999px;transition:width .3s}

/* ============ 文档视图 + 右栏目录 ============ */
.doc-layout{display:flex;gap:20px;align-items:flex-start}
.doc-layout>.card{flex:1;min-width:0}
.toc-side{flex:none;width:216px;position:sticky;top:120px;max-height:calc(100vh - 140px);display:flex;flex-direction:column;padding:10px 2px 10px 12px;border-left:1px solid var(--line-soft)}
.toc-side-t{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em}
.toc-side-list{overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:1px}
.toc-side-item{font-size:12px;line-height:1.5;color:var(--stone);cursor:pointer;padding:3px 8px;border-left:2px solid transparent;border-radius:0 6px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-side-item:hover{color:var(--text)}
.toc-side-item.lv1{font-weight:500;color:var(--charcoal)}
.doc{font-size:13.5px}
.doc h2{font-size:16px;font-weight:650;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
.doc h3{font-size:14px;font-weight:600;margin:15px 0 6px}
.doc p{margin:7px 0;line-height:1.75;color:var(--charcoal);max-width:76ch}
.doc ul{margin:7px 0 7px 20px;line-height:1.75}
.doc table{width:100%;border-collapse:collapse;margin:9px 0;font-size:12.5px}
.doc table th{background:var(--bg-soft);border:1px solid var(--line-soft);padding:6px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--muted)}
.doc table td{border:1px solid var(--line-soft);padding:6px 10px;line-height:1.65}
tr.locked-row td{background:var(--yellow-light)}
tr.locked-ok td{background:var(--green-soft)}
code{background:var(--bg-active);padding:1px 6px;border-radius:5px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.anchor-card{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-soft);padding:10px 14px;font-size:12.5px;color:var(--slate);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* ============ 用例 mini 表 ============ */
.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--canvas);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-card)}
.table th{background:var(--bg-soft);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.table tbody tr:last-child td{border-bottom:none}

/* ============ 弹窗 / 确认框 / toast ============ */
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.modal-mask{position:fixed;inset:0;background:rgba(15,18,30,.48);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;animation:fadein .18s ease}
.modal{background:var(--canvas);border-radius:14px;width:680px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow-modal);animation:pop .2s cubic-bezier(.21,1.02,.73,1)}
.modal.narrow{width:480px}
.modal-h{padding:13px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;font-weight:600;font-size:14px;gap:8px}
.modal-h .x{margin-left:auto;border:none;background:none;color:var(--muted);width:28px;height:28px;border-radius:7px}
.modal-h .x:hover{background:var(--bg-active)}
.modal-b{padding:18px 20px;overflow-y:auto;font-size:13px;color:var(--slate);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.modal-f{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;background:var(--bg-soft);border-radius:0 0 14px 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field label em{color:var(--red);font-style:normal;margin-right:2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;font-size:13px;background:var(--canvas)}
.field textarea{min-height:70px;resize:vertical}
/* 渠道选择卡片（提交需求弹窗，对齐真实平台 .seg） */
.seg{display:flex;gap:8px}
.seg-opt{flex:1;display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .13s, background .13s}
.seg-opt:hover{border-color:var(--line-strong)}
.seg-opt.on{border-color:var(--blue);background:var(--blue-light)}
.seg-opt input{width:auto;margin-top:3px;accent-color:var(--blue)}
.seg-t{font-size:13px;font-weight:600;color:var(--text)}
.seg-d{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:1px}
/* 迭代聚合条（线上流水线·迭代级） */
.agg-strip{display:flex;gap:10px;flex-wrap:wrap}
.agg{flex:1;min-width:120px;border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-soft);padding:9px 13px;cursor:pointer;transition:all .13s}
.agg:hover{border-color:var(--blue-border);box-shadow:var(--shadow-pop)}
.agg b{font-size:15px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.agg span{font-size:11.5px;color:var(--muted);margin-left:5px}
.agg .adot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--green);font-weight:600}
.agg .adot.doing{color:var(--blue)}
.checks{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);cursor:pointer;border:1px solid var(--line-soft);border-radius:8px;padding:8px 11px}
.checks input{width:auto;margin-top:3px;accent-color:var(--blue)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-10px)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--canvas);color:var(--text);border:1px solid var(--line);border-left:3px solid var(--green-vivid);padding:9px 16px 9px 12px;border-radius:10px;font-size:13px;z-index:99;box-shadow:var(--shadow-modal);display:flex;align-items:center;gap:8px;max-width:520px;animation:toastin .22s}
.toast.err{border-left-color:var(--red)}
@keyframes flashbg{0%{background:var(--yellow-light)}100%{background:transparent}}
.flash{animation:flashbg 2.2s ease-out}
@keyframes flash-in{from{opacity:0;transform:translateY(6px)}}
.anim{animation:flash-in .25s ease}

/* ============ 审计留痕 ============ */
.logline{display:flex;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line-soft);flex-wrap:wrap}
.logline:last-child{border-bottom:none}
.logline .lt{color:var(--faint);font-variant-numeric:tabular-nums;flex:none;width:132px}
.logline .lb2{font-weight:600;color:var(--charcoal);flex:none}
.empty{text-align:center;color:var(--muted);padding:34px 20px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--bg-soft);font-size:13px}
.kv{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
.kv .chip{margin:0}

/* ============ 迭代总览页 ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--canvas);border:1px solid var(--line-soft);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:12px}
.stat .n{font-size:22px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.stat-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ti-gray{background:#f2f4f7;color:var(--slate)}
.ti-blue{background:var(--blue-light);color:var(--blue)}
.ti-amber{background:var(--amber-soft);color:var(--amber)}
.ti-green{background:var(--green-soft);color:var(--green)}
.ti-red{background:var(--red-soft);color:var(--red)}
.iter-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line-soft);border-radius:10px;background:var(--canvas);margin-bottom:8px;cursor:pointer;transition:all .13s;flex-wrap:wrap}
.iter-row:hover{border-color:var(--blue-border);box-shadow:var(--shadow-pop)}
.iter-row.live{border-left:3px solid var(--blue)}
.iter-row .ir-name{width:240px;flex:none;min-width:0}
.iter-row .ir-name b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iter-row .ir-name .sub{font-size:11px}
.node-strip{display:flex;align-items:center;flex:1;min-width:430px}
.nd{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nd i{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none}
.nd.done{color:var(--slate)}
.nd.done i{background:var(--green-vivid)}
.nd.doing{color:var(--blue);font-weight:600}
.nd.doing i{background:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.nd.failed{color:var(--red);font-weight:600}
.nd.failed i{background:var(--red)}
.nd.skip{color:var(--faint)}
.nd.skip i{background:transparent;border:1.5px dashed var(--line-strong)}
.nd-sep{width:14px;height:1.5px;background:var(--line);margin:0 7px;flex:none}
.nd-sep.done{background:var(--green-vivid)}
.ir-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.todo-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line-soft);border-radius:9px;background:var(--canvas);margin-bottom:7px;font-size:13px;cursor:pointer;transition:all .13s;flex-wrap:wrap}
.todo-item:hover{border-color:var(--blue-border);box-shadow:var(--shadow-pop)}
.todo-item .grow{flex:1;min-width:200px}
/* 设计生成步骤 */
.dstep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.dstep:last-child{border-bottom:none}
.dstep .sdot{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:2px}
.sd-done{background:var(--green-soft);color:var(--green)}
.sd-run{background:var(--blue-light);color:var(--blue)}
.sd-todo{background:var(--bg-active);color:var(--faint)}
</style>
</head>

<script>
'use strict';
/* ============================================================
   设计+门禁线上化 · 交互原型 v2（迭代×需求 1:1 全流程）
   ------------------------------------------------------------
   页面架构（对 v1 的两处理解偏差修正）：
   · 唯一页面 = 迭代详情页：迭代 = 一条需求的交付容器（1:1），
     无迭代列表页；新建迭代 → 空迭代页内提交需求卡即 1:1 绑定。

     主按钮（nextAction）全程无断点，业务连续性由此保证。

   状态模型（原型演示用；字段命名对齐未来后端设计讨论稿）
   S.req = null（空迭代）| 需求卡：
     req.status: submitted → clarifying → published   ← 平台既有需求状态机（skill sync 同款）
     req.qualityTask: null | {status:'running'|'done'|'failed'}
     S.stdTask: null | {status:'running'|'done'}       ← standard_doc（L2 全答完自动排产）
   design.phase: none|running|failed|draft|final|skipped   ★平台化 UI 推导（skill 权威落库仅「已定稿/轻量跳过」）
   gate.phase:   none|blocked|running|summary|deciding|released ★平台化 UI 推导（skill 权威落库仅「待裁决/已放行（日期）」）

   GR 规则（★ = 平台化新增/重构，skill 原文无此口径）：
   GR-1 输入锚点   published 终态锁 + digest/audit/pm-checklist 三件套锚点，设计输入不漂移
   GR-2 开闸三条件★ 设计已定稿∨轻量跳过 ∧ 用例≥1且全部定稿 ∧ FR 覆盖
                    （skill 原文：用例定稿属 sdlc-test 关卡1、FR 覆盖属放行机械校验——平台前移为开闸前置）
   GR-3 变更重审   仅「定稿后未开审 / 已放行后」两窗口；产物内容变更检测（★平台化=规范化摘要比对；
                    skill 原文为最新份判定+锚点日期比对，无 hash）；人确认才开新轮
   GR-4 放行       = 全部裁决 ∧ 落改闭环(有修订事实) ∧ 机械校验全绿；平台口径唯一
   GR-5 引用可跳可溯源  命名空间.编号 一跳定位定义源 + 溯源卡；不可达引用显式报错
   issue 编号权威前缀：D=分歧(交叉审查) / A=架构一致性 / S=数据模型与SQL / T=测试可测性
   ============================================================ */

/* ---------------- 工具 ---------------- */
const el = id => document.getElementById(id);
const op = () => el('d-operator').value.trim() || '（未署名）';
const now = () => { const d = new Date(); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(st, act){ st.log.unshift({t:now(), by:op(), act}); }
function toast(msg, isErr){
  const r = el('toast-root');
  r.innerHTML = `<div class="toast${isErr?' err':''}">${isErr?'✕':'✓'} ${esc(msg)}</div>`;
  clearTimeout(r._t); r._t = setTimeout(()=>r.innerHTML='', 3200);
}

/* ---------------- 基础演示数据 ---------------- */

const cloneCases = () => BASE_CASES.map(c=>({...c, verifyRefs:[...c.verifyRefs], defectRefs:[...c.defectRefs], comments:c.comments.map(x=>({...x}))}));

/* 澄清清单（与体检同源 P 编号；D21 处置四态：pending/answered/rejected/deferred） */

const AUDIT_ITEMS = [
  {id:'P04', sev:'red', src:'详述6.3', related:['TC-09','TC-18'], title:'报名截止允许人工操作，与「自动顺延」答复冲突',

   quote:'「报名截止后____（原文留白）自动进入比赛中」',
   go:'转 Q 表 → 确认.Q-03（阻塞 F05，不阻塞全局）'},
  {id:'P15', sev:'yellow', src:'详述6.4', related:['TC-18'], title:'作品修改窗口未定义',
   quote:'「作品提交后可修改」未说明截止时点',
   go:'本期不做 → 修改窗口归下期（设计 §8）'},

const D_ROWS = {1:'C 约束 · 重复提交不得产生多条记录', 2:'C 约束 · 软删主表必须过滤子表对账',
  3:'C 约束 · 顺延只允许单向推进，禁止回拨', 4:'C 约束 · 截止顺延由定时任务驱动（幂等）', 5:'H 假设 · 列表统计本地缓存 5min'};

/* 门禁 issue（权威编号前缀：D=分歧 / A=架构一致性 / S=数据模型与SQL / T=测试可测性；
   tradeoff 条目 = RECONCILE「有效权衡」标记，默认进批量预填「权衡记档组」） */
const BASE_ISSUES = [
  {code:'D-01', sev:'red', theme:'接口契约', role:'交叉审查者', div:true,

const ITER_LIST = ['v3.7.2','v3.7.1','v3.8.0'];
const ITER_CACHE = {};
function iterLabel(v){
  if(v===S.iter) return `${v} · 当前`;
  if(v==='v3.7.1') return 'v3.7.1 · 已放行归档（示例）';
  if(v==='v3.8.0') return 'v3.8.0 · 空迭代';
  if(v==='v3.7.2') return 'v3.7.2 · 演示主迭代';
  return v;
}
function archivedIterState(){
  const st = freshState('s14');
  st.iter = 'v3.7.1';
  st.req.id = 'REQ-2026-036';
  st.req.name = '鸿儒 v3.7.1 · 成绩复核通道';

  return st;
}
function switchIter(v){
  if(!v || v===S.iter) return;
  ITER_CACHE[S.iter] = S;                 // 离开当前迭代：缓存现场（切回可续）
  const fromView = S.view;
  if(ITER_CACHE[v]) S = ITER_CACHE[v];
  else if(v==='v3.7.1') S = ITER_CACHE[v] = archivedIterState();
  else if(v==='v3.8.0') S = ITER_CACHE[v] = emptyIterState(v);
  S.view = fromView==='list' ? 'list' : 'detail';   // 从哪层进来就回哪层
  S.refTrace = null;
  render(); window.scrollTo(0,0);
}
function emptyIterState(v){
  const st = freshState('s0'); st.iter = v;
  st.note = `空迭代（${v}）：在下方提交需求卡即完成 1:1 绑定；可用顶栏切换器或迭代列表切换。`;
  return st;
}

/* ---------------- 派生与统计（单一来源） ---------------- */
const digestReady = () => !!S.req && ['clarifying','published'].includes(S.req.status);
function decisionSummary(st){
  const G = st.gate;
  if(!G.reconcile || !G.reconcile.merged) return null;
  const total = G.reconcile.merged;                 // 裁决单元总数（RECONCILE 输出，唯一权威）
  const off = Math.max(0, total - G.issues.length); // 屏外条数（原型仅渲染 11/41，其余已按同规则预置）
  const doneVis = G.issues.filter(i=>i.dec).length;
  const doneOff = (G.phase==='deciding'||G.phase==='released') ? off : 0;
  return {done: doneVis + doneOff, total};
}

const REF_RE = /(详述\d+(?:\.\d+)*|需求\.FR-\d+|需求\.A\d+|体检\.P\d+|用例\.TC-\d+|确认\.Q-\d+|FR-\d+|TC-\d+|Q-\d+|\bF\d{2}\b|\bD\d\b|\b[DAST]-\d{2}\b)/g;
function lk(t){
  return String(t ?? '').replace(REF_RE, m=>{
    const ref = m.replace(/^(需求\.|体检\.|用例\.|确认\.)/, '');
    return `<span class="reflink" data-ref="${ref}" title="点击跳转定义源并溯源">${m}</span>`;
  });
}
function coveredBy(frId){ return S.cases.filter(c=>(c.pts||'').includes(frId)).map(c=>c.id); }
function resolveRef(ref){
  let m;
  if(m = ref.match(/^详述(\d+(?:\.\d+)*)$/))
    return {tab:'origin', anchor:'src-'+m[1].replace(/\./g,'-'), ref:'原文 '+ref,
      kv:[['定义源','原始需求快照（飞书块结构 · GR-1 冻结）'],['条款','详述'+m[1]],
          ['用途','质检 / 设计 / 澄清口径的定义源——引用此处即证明口径有出处']]};
  if(m = ref.match(/^FR-(\d+)$/)){
    if(!digestReady()) return null;
    const fr = FR_POINTS.find(x=>x.id===ref);
    if(!fr) return null;
    const cov = coveredBy(ref);
    return {tab:'digest', anchor:'fr-'+ref, ref:'需求.'+ref,
      kv:[['定义源','digest §7 需求点注册表（快照冻结 · GR-1）'],['出处',fr.src],
          ['分组 / 模块',fr.grp+' / '+fr.mod],
          ['反向覆盖（RTM）', cov.length ? cov.map(c=>lk(c.id)).join('、') : '⚠ 0 条用例（开闸条件③将拦截）']]};
  }
  if(m = ref.match(/^A(\d+)$/)){
    if(!digestReady()) return null;
    return {tab:'digest', anchor:'d-a'+m[1], ref:'需求.A'+m[1],
      kv:[['定义源','digest §8 假设清单（快照冻结 · GR-1）'],['用途','遗留假设——引用此处即证明口径按假设处理并留痕']]};
  }
  if(m = ref.match(/^P(\d+)$/)){
    if(!digestReady()) return null;
    const au = AUDIT_ITEMS.find(x=>x.id===ref);
    if(!au) return null;
    return {tab:'audit', anchor:'audit-'+au.id, ref:'体检.'+au.id,
      kv:[['定义源','audit-20260929.md（已冻结）'],['严重度',au.sev==='red'?'🔴 阻断':au.sev==='yellow'?'🟡 严重':'🔵 建议'],
          ['问题',au.title],['去向',au.go]]};
  }
  if(m = ref.match(/^TC-(\d+)$/)){
    const c = S.cases.find(x=>x.id===ref);
    if(!c) return null;
    return {tab:'cases', anchor:'case-'+ref, ref:'用例.'+ref,
      kv:[['定义源','test_case（cases 注册表 · skill 来源全量替换语义）'],['标题',c.title],
          ['状态',c.st==='reviewed'?'已定稿':'待审核'],['覆盖需求点',c.pts||'—']]};
  }
  if(m = ref.match(/^Q-(\d+)$/)){
    const key = '确认.'+ref;
    return {tab:'design', anchor:'d-q'+m[1], ref: key,
      kv:[['定义源','design.md 头部 Q 表'],['当前假设','自动顺延 72 小时'],['阻塞范围','F05（锁功能点不锁全局）'],
          ['拍板状态', S.design.locked[key] ? '已拍板' : '待拍板（锁定契约行）']]};
  }
  if(m = ref.match(/^F(\d{2})$/))
    return {tab:'design', anchor:'d-f'+m[1], ref:'功能.'+ref,
      kv:[['定义源','design.md §2 接口契约（挂 F 编号 + 口径来源）'],['可见性','契约行见跳转处']]};
  if(m = ref.match(/^D(\d)$/))
    return {tab:'design', anchor:'d-d'+m[1], ref:'设计.D'+m[1],
      kv:[['定义源','design.md §6 关键实现决策 D 表'],['决策',D_ROWS[m[1]]||'—'],
          ['接受条件', m[1]==='5' ? (S.design.d5ok?'压测 P99>500ms 则调整（gate 落改已补）':'未写（gate T-01 在审）') : '—']]};
  if(m = ref.match(/^([DAST])-(\d{2})$/)){
    const iss = (S.gate.issues||[]).find(i=>i.code===ref);
    if(!iss) return null;
    return {tab:'gate', anchor:'iss-'+ref, ref:'评审.'+ref,
      kv:[['定义源',`门禁 r${S.gate.round} issues（RECONCILE 汇总后裁决单元）`],['角色',iss.role],['主题',iss.theme],
          ['裁决状态', iss.dec ? iss.dec+'（'+(iss.by||'')+'）' : '待裁决']]};
  }
  return null;
}
function openRef(ref){
  const t = resolveRef(ref);
  if(!t){ toast(`引用不可达：${ref}（定义源未注册或产物未生成）`, true); return; }
  if(t.tab==='design' && S.design.phase==='final') S.design.showDoc = true;
  // 跳转协议（对齐真实平台 trace.js）：目标在折叠组内时先展开，折叠不吞定位
  if(t.tab==='digest' && t.anchor.startsWith('fr-')){
    const f = FR_POINTS.find(x=>x.id===t.anchor.slice(3)); if(f) S.openGrps['fr:'+f.grp] = true;
  }
  if(t.tab==='audit'){ const pid = t.anchor.slice(6); S.openGrps['audit:'+(AUDIT_THEME[pid]||'')] = true; }
  if(t.tab==='clarify'){ const c = S.clarify.find(x=>x.seq===t.anchor.slice(4)); if(c) S.openGrps['chk:'+c.theme] = true; }
  S.refTrace = t; S.tab = t.tab;
  render();
  setTimeout(()=>{
    const n = document.getElementById(t.anchor);
    if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); }
    else toast('定义处当前视图未渲染（产物未生成/已收起）——溯源卡见页首', true);
  }, 120);
}

/* ============================================================
   迭代列表页（平台首页）：一行 = 一个迭代及其 1:1 绑定的唯一需求卡

const NODES_EMPTY = [['质检','todo'],['澄清','todo'],['发布','todo'],['设计','todo'],['用例','todo'],['门禁','todo'],['放行','todo']];
function nodesOf(st){
  const r=st.req, D=st.design, G=st.gate;
  if(!r) return NODES_EMPTY;
  const q = ['clarifying','published'].includes(r.status) ? 'done'
    : r.status==='submitted' ? (r.qualityTask ? (r.qualityTask.status==='running'?'doing':r.qualityTask.status==='failed'?'failed':'todo') : 'todo')
    : 'todo';
  const clf = r.status==='published' ? 'done' : r.status==='clarifying' ? 'doing' : 'todo';
  const pub = r.status==='published' ? 'done' : 'todo';
  const dsg = D.phase==='final'?'done':D.phase==='running'?'doing':D.phase==='failed'?'failed':D.phase==='draft'?'doing':D.phase==='skipped'?'skip':'todo';
  const reviewed = st.cases.filter(c=>c.st==='reviewed').length;
  const caseN = st.cases.length ? (reviewed===st.cases.length?'done':'doing') : 'todo';
  const gate = G.phase==='released'?'done':(['running','summary','deciding','blocked'].includes(G.phase))?'doing':'todo';
  const rel = G.phase==='released'?'done':'todo';
  return [['质检',q],['澄清',clf],['发布',pub],['设计',dsg],['用例',caseN],['门禁',gate],['放行',rel]];
}
/* 状态 → 当前卡点/下一步 描述（列表行与快捷场景共用一套派生口径） */
function actOf(st){
  const r=st.req, G=st.gate, D=st.design;
  if(!r) return {act:'提交需求卡，完成 1:1 绑定', actCls:'b-blue'};
  if(r.status==='submitted')
    return r.qualityTask ? (r.qualityTask.status==='running'?{act:'质检进行中',actCls:'b-blue'}:{act:'质检失败，可重试',actCls:'b-red'}) : {act:'待启动质检',actCls:'b-blue'};
  if(r.status==='clarifying'){
    const pend = st.clarify.filter(c=>c.status==='pending').length;
    if(pend>0) return {act:`澄清 ${st.clarify.length-pend}/${st.clarify.length} · 待处置`,actCls:'b-amber'};
    if(st.stdTask && st.stdTask.status==='running') return {act:'标准文档合成中',actCls:'b-blue'};
    return st.stdTask ? {act:'待发布标准文档（终态）',actCls:'b-amber'} : {act:'可生成标准文档',actCls:'b-blue'};
  }
  if(G.phase==='released') return st.gate.change ? {act:`已放行 r${G.released.round} · 有变更待处理`,actCls:'b-amber'} : {act:`已放行 r${G.released.round}（归档）`,actCls:'b-green'};
  if(G.phase==='running') return {act:'门禁评审进行中',actCls:'b-blue'};
  if(G.phase==='summary') return {act:'RECONCILE 汇总待裁决',actCls:'b-blue'};
  if(G.phase==='deciding'){ const s=decisionSummary(st);
    return s && s.done>=s.total ? {act:'全部裁决完成，待放行',actCls:'b-amber'} : {act:`裁决 ${s?s.done:0}/${s?s.total:0}`,actCls:'b-amber'}; }
  if(G.phase==='blocked') return {act:'待开闸（条件未齐）',actCls:'b-amber'};
  if(D.phase==='running') return {act:'技术设计生成中',actCls:'b-blue'};
  if(D.phase==='failed') return {act:'设计生成失败，可重试',actCls:'b-red'};
  if(D.phase==='draft') return {act:'设计草稿待定稿',actCls:'b-amber'};
  if(D.phase==='final') return {act:'设计已定稿，可开闸',actCls:'b-blue'};
  if(D.phase==='skipped') return {act:'轻量跳过（C 级），可开闸',actCls:'b-blue'};
  if(!r.targetRepo) return {act:'未配置目标代码仓',actCls:'b-red'};
  if(r.riskTier==='C') return {act:'可声明轻量跳过（C 级）',actCls:'b-blue'};
  return {act:'可生成技术设计',actCls:'b-blue'};
}
function rowOf(st){
  const r = st.req;
  const base = {iter: st.iter, live: st===S, upd: st.log[0] ? st.log[0].t.slice(5) : ''};
  if(!r) return {...base, empty:true, tier:'', st2:'空迭代', st2Cls:'b-gray', nodes:NODES_EMPTY, ...actOf(st)};
  const st2m = {submitted:['已提交','b-amber'], clarifying:['待澄清','b-blue'], published:['已发布','b-green']};
  const [st2, st2Cls] = st2m[r.status] || ['—','b-gray'];
  const a = st===S ? nextAction() : null;
  const act = a ? {act: a.label + (a.disabled?'（被守卫拦截）':''), actCls: a.disabled?'b-red':'b-blue'} : actOf(st);
  return {...base, id:r.id, name:r.name, tier:r.riskTier, st2, st2Cls, nodes:nodesOf(st), ...act};
}

/* ---------------- 生命周期派生（唯一来源：流水线/阶段点共用） ---------------- */
function liveNodes(){ return nodesOf(S); }

/* ---------------- 主按钮（全流程无断点） ---------------- */
function nextAction(){
  const r=S.req;
  if(!r) return null;
  const D=S.design, G=S.gate;
  if(r.status==='submitted'){
    if(!r.qualityTask) return {label:'启动质检', act:'start-quality'};
    if(r.qualityTask.status==='running') return null;
    if(r.qualityTask.status==='failed') return {label:'重试质检', act:'retry-quality'};
  }
  if(r.status==='clarifying'){
    const pend = S.clarify.filter(c=>c.status==='pending').length;
    if(pend>0) return {label:`继续澄清（${S.clarify.length-pend}/${S.clarify.length}）`, act:'goto-clarify'};
    if(S.stdTask && S.stdTask.status==='running') return null;
    if(!S.stdTask) return {label:'生成标准文档', act:'gen-standard'};
    return {label:'发布标准文档（终态）', act:'open-publish'};
  }
  if(r.status==='published'){
    if(D.phase==='running' || G.phase==='running') return null;
    if(D.phase==='none' && !r.targetRepo) return {label:'配置目标代码仓', act:'config-repo'};
    if(D.phase==='none' && r.riskTier==='C') return {label:'声明轻量跳过（C 级）', act:'declare-skip'};
    if(D.phase==='none') return {label:'生成技术设计', act:'gen-design'};
    if(D.phase==='failed') return {label:'重试设计生成', act:'retry-design'};
    if(D.phase==='draft') return {label:'设计定稿（确认点②）', act:'finalize-design'};
    if(D.phase==='skipped' || D.phase==='final'){
      if(G.phase==='none'||G.phase==='blocked'){
        const chk = gateChecks();
        return chk.every(c=>c.ok)
          ? {label:'开评审（'+(r.riskTier==='C'?'自查档':(r.riskTier==='A'?'4 角色 fresh-context 扇出':'2 角色扇出'))+'）', act:'open-gate'}
          : {label:'开评审', act:'open-gate', disabled:true, why:chk.filter(c=>!c.ok).map(c=>c.t).join('；')};
      }
      if(G.phase==='summary') return {label:'进入裁决', act:'to-deciding'};
      if(G.phase==='deciding'){
        const s = decisionSummary(S);
        if(s && s.done>=s.total) return {label:'校验并放行', act:'open-release'};
        return {label:`继续裁决 ${s.done}/${s.total}`, act:'goto-deciding'};
      }
      if(G.phase==='released') return G.change ? {label:'处理变更（开新一轮）', act:'reopen-round'} : null;
    }
  }
  return null;
}
function watchStd(st){
  const r = st.req;
  if(r && r.status==='clarifying' && st.clarify.length && st.clarify.every(c=>c.status!=='pending') && !st.stdTask){
    st.stdTask = {status:'running'};
    log(st, '澄清全部处置完成——L2 编排自动排产 standard_doc（只自动一次）');
    toast('澄清闭环 ✓ 已自动排产标准文档合成');
  }
}

function clrItem(c){
  let ans;
  if(c.status==='pending'){
    ans = `<div class="ans" style="margin-top:10px"><span class="lb warn">待答复</span>
      <textarea data-clf="${c.seq}" placeholder="PM 在此作答…（失焦自动保存）" style="width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;font-size:13px;margin-top:5px;min-height:48px;resize:vertical">${esc(c.answer||'')}</textarea>
      <div style="display:flex;gap:14px;margin-top:6px">
        <button class="btn small link" data-act="dispose-open" data-arg="${c.seq}:rejected">驳回（不是问题）</button>
        <button class="btn small link" data-act="dispose-open" data-arg="${c.seq}:deferred">挂起（转遗留假设）</button>
      </div></div>`;
  } else if(c.status==='rejected' || c.status==='deferred'){
    ans = `<div class="ans" style="margin-top:10px"><span class="lb">${c.status==='rejected'?'已驳回（不是问题，不进定稿）':'已挂起（转遗留假设 需求.Axx）'}</span>
      <span class="sub">${esc(c.note||'')}</span>
      <button class="btn small link" data-act="reopen-clr" data-arg="${c.seq}" style="margin-left:8px">重新作答</button></div>`;
  } else {
    ans = `<div class="ans" style="margin-top:10px"><span class="lb">答复</span>${esc(c.answer||'')}
      <button class="btn small link" data-act="reopen-clr" data-arg="${c.seq}" style="margin-left:8px">重新作答</button></div>`;
  }
  return `<div class="check-item ${c.level}" id="clr-${c.seq}" style="background:var(--canvas)">
    <div class="i-head"><span class="lvl-dot ${c.level}"></span><b>${c.seq}</b><span class="chip">${esc(c.theme)}</span>
      <button class="btn small link" data-act="jump-audit" data-arg="${c.seq}">来自体检.${c.seq} ↗</button><span class="grow"></span></div>
    <div class="scene">${esc(c.question)}</div>

    ${ans}</div>`;
}

  }
  const f=S.caseFilter, q=S.caseQ.trim();

  const k=S.caseSortKey, dir=S.caseSortDir==='asc'?1:-1;
  if(k) list.sort((a,b)=>{ const x=k==='id'?(a.caseNo??a.id):(a[k]??''), y=k==='id'?(b.caseNo??b.id):(b[k]??'');
    return (typeof x==='number'? x-y : String(x).localeCompare(String(y)))*dir; });
  const reviewed=S.cases.filter(c=>c.st==='reviewed').length;
  const sortTh=(key,label,w)=>`<th data-act="case-sort" data-arg="${key}" style="cursor:pointer;user-select:none;${w?'width:'+w:''}">${label}${S.caseSortKey===key?(S.caseSortDir==='asc'?' ↑':' ↓'):''}</th>`;
  return `
  <div class="banner blue"><b>用例 lane</b><span class="sub">双来源：sdlc-test 推送 = 平台只读 + 评论反馈维护人；表单提交 = 提交人可编辑。定稿是开闸前置②（GR-2★）；门禁放行也会自动置定稿（标注来源，GR-4 联动）。</span></div>
  <div class="card">
    <h3>测试用例（${S.cases.length}）<span class="badge ${reviewed===S.cases.length?'b-green':'b-amber'}">${reviewed}/${S.cases.length} 已定稿</span>
      <span style="flex:1"></span>
      <button class="btn small primary" data-act="case-form-open">+ 表单提交用例</button>
      <button class="btn small" data-act="bulk-review" ${reviewed===S.cases.length?'disabled':''}>一键定稿未定稿项</button>
    </h3>
    <div class="filters">
      <select data-act-change="case-filter">
        <option value="all" ${f==='all'?'selected':''}>全部状态</option>
        <option value="draft" ${f==='draft'?'selected':''}>待审核</option>
        <option value="reviewed" ${f==='reviewed'?'selected':''}>已定稿</option>
      </select>
      <input data-act-change="case-q" value="${esc(S.caseQ)}" placeholder="搜索用例标题…" style="width:200px">
    </div>
    <table class="table"><thead><tr>
      ${sortTh('id','编号','108px')}<th>标题</th><th style="width:180px">关联需求点</th>
      ${sortTh('pri','优先级','66px')}${sortTh('st','审核状态','92px')}
      <th style="width:96px">来源人</th><th style="width:92px">来源工具</th><th style="width:150px">操作</th></tr></thead><tbody>
      ${list.map(c=>`<tr data-act="case-open" data-arg="${c.id}" style="cursor:pointer" id="case-${c.id}">
        <td class="sub"><div>${c.id}</div><div style="font-size:11px;color:var(--faint)" title="全局登记序号（跨需求唯一，口头可引用）">#${c.caseNo}</div></td>
        <td>${esc(c.title)}</td>
        <td class="sub">${lk(esc(c.pts))||'—'}</td>
        <td><span class="badge ${c.pri==='P0'?'b-red':c.pri==='P1'?'b-amber':'b-gray'}">${c.pri}</span></td>
        <td>${c.st==='reviewed'
          ?`<span class="badge b-green">已定稿</span>${c.src?`<div style="font-size:11px;color:var(--muted)">${esc(c.src)}</div>`:''}`
          :'<span class="badge b-gray">待审核</span>'}</td>
        <td class="sub">${esc(c.owner)}</td>
        <td class="sub">${esc(c.tool)}</td>
        <td>${c.st==='reviewed'
          ?`<button class="btn small" data-act="case-unreview" data-arg="${c.id}">退回</button>`
          :`<button class="btn small primary" data-act="case-review" data-arg="${c.id}">定稿</button>`}
          <button class="btn small link" data-act="case-open" data-arg="${c.id}">详情</button></td>
      </tr>`).join('')}
      ${!list.length?'<tr><td colspan="8"><div class="empty">当前筛选条件下没有用例</div></td></tr>':''}
    </tbody></table>
    ${S.gate.phase==='deciding'?'<div class="banner amber" style="margin:10px 0 0"><b>评审进行中</b><span class="sub">此刻退回/修改用例属于评审中变更——走「落改」通道，或人工「作废重审」（GR-3 窗口限定）。</span></div>':''}
  </div>`;
}

/* ---- 门禁 tab ---- */
function gateChecks(){
  const D=S.design;
  const reviewed = S.cases.filter(c=>c.st==='reviewed').length;
  const cov = rtmStats();
  return [
    {t:'设计已定稿 ∨ 轻量跳过', ok: D.phase==='final'||D.phase==='skipped',
     d: D.phase==='final'?`已定稿 v${D.final.ver}（${D.final.by}）`:D.phase==='skipped'?'已声明轻量跳过（C 级）':'设计 lane 未完成',
     goto:'design'},
    {t:'用例 ≥1 且全部定稿', ok: S.cases.length>0 && reviewed===S.cases.length,
     d: S.cases.length?`${reviewed}/${S.cases.length} 已定稿`:'用例尚未推送（case_gen）', goto:'cases'},
    {t:'FR 覆盖（RTM 正向）', ok: cov.total>0 && cov.coveredN===cov.total,
     d:`正向 ${cov.coveredN}/${cov.total}${cov.uncovered.length?' · 缺口：'+cov.uncovered.map(f=>f.id).join('、'):''}`, goto:'cases'},
  ];
}
function gateTab(){
  const G = S.gate, r = S.req;
  if(r.status!=='published') return lanePending('门禁','设计定稿（或 C 级轻量跳过）且用例齐套后，开闸检查将出现在这里。');
  const head = `<div class="banner blue"><b>门禁 lane</b><span class="sub">分档对抗评审（A=4 独立子代理 / B=2 / C=自查，全新上下文 fresh-context）→ RECONCILE 汇总 → 人逐条裁决 → 放行（GR-4）。放行 = 平台权威登记，开发侧由 guard_dev 机械拦截（guard_dev 改读平台 API，双源已消除）。评审状态机六态为平台化 UI 推导（skill 权威落库仅「待裁决 / 已放行（日期）」两值）。</span></div>`;
  if(G.phase==='none'){
    if(D_none()) return head + `<div class="card"><h3>尚未开闸</h3><div class="empty">完成设计 lane（或声明轻量跳过）后，这里会出现开闸检查。</div></div>`;
    return head + gateCheckCard();
  }
  if(G.phase==='blocked') return head + gateCheckCard();
  if(G.phase==='running') return head + runningHtml();
  if(G.phase==='summary') return head + reconcileHtml();
  if(G.phase==='deciding') return head + decidingHtml();
  if(G.phase==='released') return head + releasedHtml();
  return head;
}
function D_none(){ return S.design.phase!=='final' && S.design.phase!=='skipped'; }
function gateCheckCard(){
  const chk = gateChecks();
  const allOk = chk.every(c=>c.ok);
  return `
  <div class="card anim"><h3>开闸检查（GR-2 三条件 · 平台化前置重构）</h3>
    <p class="sub" style="margin-bottom:10px">skill 原文中「用例定稿」属 sdlc-test 关卡1 前置、「FR 覆盖」属放行机械校验；平台将两者前移为开闸条件——保证评审对象齐套再烧 token。</p>
    <div class="gate-check">
      ${chk.map(c=>`<div class="gc-item ${c.ok?'gc-ok':'gc-no'}">
        <span class="gc-ico">${c.ok?'✓':'✗'}</span>
        <div style="flex:1"><div class="gc-t">${c.t}</div><div class="gc-d">${c.d}</div></div>
        ${!c.ok&&c.goto?`<button class="btn small" data-act="tab" data-arg="${c.goto}">去处理 →</button>`:''}
      </div>`).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button class="btn primary" data-act="open-gate" ${allOk?'':'disabled'} title="${allOk?'':chk.filter(c=>!c.ok).map(c=>c.t).join('；')}">开评审（${S.req.riskTier==='C'?'C 级自查档':(S.req.riskTier==='A'?'A 级 · 4 角色 fresh-context 扇出':'B 级 · 2 角色扇出')}）</button>
    </div></div>`;
}
function runningHtml(){
  const G=S.gate;
  return `
  <div class="card anim"><h3><span class="spin"></span> 对抗评审执行中（r${G.round}）</h3>
    <p class="sub" style="margin-bottom:10px">每个角色是<strong>全新上下文（fresh-context）子代理</strong>，只喂 ARTIFACT+角色审查要点+CONTRACT 相关章节+近期误报模式（不喂会话全文）；交叉审查者是唯一同时读设计×用例的角色，只产分歧清单。评审中产物冻结（GR-3）。</p>
    <div class="roles">${G.roles.map(r=>`
      <div class="role-card"><b>${r.st==='running'?'<span class="spin"></span>':'⏳'} ${r.name}</b><p>${r.desc}</p>
      <p class="sub">${r.st==='running'?`已 ${r.min} 分钟`:'排队中'}</p></div>`).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn primary" data-act="sim-gate-done">模拟：扇出完成 → 汇总</button>
      <button class="btn danger" data-act="abort-gate">作废重审（人工）</button>
    </div></div>`;
}
function reconcileHtml(){
  const G=S.gate;
  return `
  <div class="card anim"><h3>RECONCILE 汇总完成（独立上下文运行）</h3>
    <div class="recon" style="margin:6px 0 12px">
      <div class="box"><b>${G.reconcile.raw}</b><span>原始发现</span></div><span class="arr">→</span>
      <div class="box noise"><b>-${G.reconcile.mis}</b><span>契约误读</span></div>
      <div class="box noise"><b>-${G.reconcile.tradeoff}</b><span>有效权衡·记档</span></div>
      <div class="box noise"><b>-${G.reconcile.noise}</b><span>噪音</span></div><span class="arr">→</span>
      <div class="box"><b>${G.reconcile.valid}</b><span>有效条目</span></div><span class="arr">→</span>
      <div class="box"><b>${G.reconcile.merged}</b><span>同根因合并·裁决单元</span></div>
    </div>
    <div class="banner" style="margin:0 0 12px"><b>机械校验（入库前）</b><span class="sub">引用可达 ✓ ｜ 计数同源 ✓（速览↔明细） ｜ 场景列非空 ✓ ｜ 分歧单元置顶 ✓ —— 全绿才置「待裁决」，噪音不直达裁决人。</span></div>
    <p class="sub" style="margin-bottom:10px">裁决单元已按：分歧单元置顶（必须逐条）→ 严重度/主题分组；角色为行内属性。中低严重度条目由 AI 预填建议裁决，可整批确认、可单独改判。</p>
    <button class="btn primary" data-act="to-deciding">进入裁决（${G.reconcile.merged} 条）</button>
  </div>`;
}

/* issue 卡（全局：裁决列表与已放行归档共用；readonly=归档只读，无操作钮） */
function issueCard(i, readonly=false){
  const decided = !!i.dec;
  return `<div class="issue sev-${i.sev} ${decided?'decided':''}" id="iss-${i.code}">
    <div class="i-head">
      <span class="lvl-dot ${i.sev}"></span><b>${i.code}</b>
      ${i.div?'<span class="badge b-red">分歧单元</span>':''}
      ${i.tradeoff?'<span class="chip">权衡记档</span>':''}
      <span class="chip">${esc(i.theme)}</span><span class="chip">${esc(i.role)}</span>
      <span class="chip ${i.basis==='hard'?'warn':''}">${i.basis==='hard'?'硬依据':'软依据'}</span>
      ${i.lockedQ?`<span class="chip lock" data-act="open-q">${esc(i.lockedQ)}</span>`:''}
      <span class="grow"></span>
      ${decided?`<span class="badge ${i.dec==='落改'?'b-blue':i.dec==='驳回'?'b-gray':'b-amber'}">${i.dec}</span>`:''}
    </div>
    <div class="scene">${lk(esc(i.scene))}</div>
    <details ${i.div?'open':''}><summary class="sub" style="cursor:pointer">原文摘引 / 位置</summary>
      <div class="quote"><span class="qlb">原文摘引</span>${lk(esc(i.quote))}</div></details>
    <div class="loc" style="margin-top:6px">落点：${lk(esc(i.loc))}</div>
    ${decided
      ?`<div class="i-verdict"><span class="badge ${i.dec==='落改'?'b-blue':i.dec==='驳回'?'b-gray':'b-amber'}">${i.dec}</span>
          <span>${esc(i.by||op())} · ${esc(i.note||'')}</span>
          ${i.dec==='落改'?'<span class="chip ok">修订工作项已关联 →</span>':''}
          ${readonly?'':'<button class="btn small link" data-act="re-decide" data-arg="'+i.code+'">改判</button>'}</div>`
      :(readonly
        ?'<div class="i-verdict"><span class="badge b-amber">待裁决</span></div>'
        :`<div class="i-ops">
            <button class="btn small primary" data-act="dec" data-arg="${i.code}:落改">落改</button>
            <button class="btn small" data-act="dec" data-arg="${i.code}:驳回">驳回</button>
            <button class="btn small" data-act="dec" data-arg="${i.code}:存疑">存疑</button>
            ${i.suggest?`<span class="sub">AI 预填建议：${i.suggest}（可一键批量确认）</span>`:''}
          </div>`)}
  </div>`;
}
function decidingHtml(){
  const G = S.gate;
  const f = G.filter||'all';
  const s = decisionSummary(S);
  const divs = G.issues.filter(i=>i.div);
  const rest = G.issues.filter(i=>!i.div);
  const match = i => f==='all' || (f==='todo'?!i.dec:!!i.dec);
  const unreviewed = G.issues.filter(i=>!i.dec && i.suggest);
  const doubts = G.issues.filter(i=>i.dec==='存疑');
  const themes = [...new Set(rest.map(i=>i.theme))];
  return `
  ${doubtPanel(doubts)}
  ${revPanel()}
  <div class="card anim">
    <h3>裁决（r${G.round}）<span class="badge ${s.done>=s.total?'b-green':'b-amber'}">${s.done}/${s.total}</span>
      <span style="flex:1"></span>
      <span class="prog-row" style="width:220px"><span class="bar"><span class="bar-fill" style="width:${Math.round(s.done/s.total*100)}%"></span></span></span>
    </h3>
    <div class="filters">
      <select data-act-change="gate-filter">
        <option value="all" ${f==='all'?'selected':''}>全部</option>
        <option value="todo" ${f==='todo'?'selected':''}>待裁决</option>
        <option value="done" ${f==='done'?'selected':''}>已裁决</option>
      </select>
      <button class="btn small" data-act="jump-next">跳到下一条待裁决</button>
      <span class="spacer"></span>
      ${unreviewed.length?`<button class="btn small" data-act="batch-apply">批量确认 AI 预填建议（${unreviewed.length} 条）</button>`:''}
    </div>
    <p class="sub" style="margin-bottom:6px">原型仅渲染 ${G.issues.length}/${s.total} 条（屏外 ${Math.max(0,s.total-G.issues.length)} 条已按同规则预置），交互口径与全量一致。裁决<strong>即时逐条保存</strong>（对齐澄清答复），中断后由主按钮「继续裁决」直达第一条未裁项。</p>
    ${divs.filter(match).length?`<div class="grp-t">分歧单元（设计 × 用例冲突，必须逐条）<span class="cnt">置顶</span></div>${divs.filter(match).map(x=>issueCard(x)).join('')}`:''}
    ${themes.map(th=>{
      const g = rest.filter(i=>i.theme===th && match(i));
      return g.length?`<div class="grp-t">${th}<span class="cnt">${g.length} 条</span></div>${g.map(x=>issueCard(x)).join('')}`:'';
    }).join('')}
  </div>`;
}
function revPanel(){
  const revs = S.gate.revs;
  if(!revs || !revs.length) return '';
  return `<div class="card anim"><h3>修订工作项（落改的执行通道）<span class="sub" style="font-weight:400">有产物修订事实才能置「已执行」；全部已执行是放行前置（GR-4）</span></h3>
    ${revs.map((rv,ri)=>`<div class="rev-card ${rv.status==='已执行'?'done':''}">
      <div class="rev-h"><b>${rv.id}</b><span class="badge ${rv.status==='已执行'?'b-green':rv.status==='待采纳'?'b-amber':'b-blue'}">${rv.status}</span>
        <span>落点：${esc(rv.target)}</span><span class="grow"></span><span class="sub">${esc(rv.by==='—'?'待处理':rv.by)}</span></div>
      ${rv.status!=='待修订'?`<div class="rev-diff"><span class="del">- ${esc(rv.change.split(' → ')[0])}</span><span class="ins">+ ${esc(rv.change.split(' → ')[1]||rv.change)}</span></div>`:''}
      <div class="i-ops">
        ${rv.status==='待修订'?`<button class="btn small primary" data-act="rev-ai" data-arg="${ri}">AI 修订（产草稿）</button>`:''}
        ${rv.status==='待修订'?`<span class="sub">修订将走草稿通道，由人采纳后落盘（正式产物只能人采纳）</span>`:''}
        ${rv.status==='待采纳'?`<button class="btn small primary" data-act="rev-adopt" data-arg="${ri}">采纳修订（落盘 + 置已执行）</button><span class="sub">采纳需署名：${esc(op())}</span>`:''}
        ${rv.status==='已执行'?`<span class="sub">已执行 · ${esc(rv.by)} —— 放行校验项「落改闭环」据此判定</span>`:''}
      </div></div>`).join('')}
  </div>`;
}
function doubtPanel(doubts){
  if(!doubts.length) return '';
  return `<div class="banner amber anim"><b>存疑聚合（${doubts.length}）</b>
    <span class="sub">${doubts.map(i=>`<b>${i.code}</b> ${esc(i.note||'')}`).join(' ｜ ')}。存疑不阻断放行计数但会在此常驻老化——可转为澄清问题回流 PM，或随时改判。</span>
    <span class="b-act"><button class="btn small" data-act="doubt-to-clarify">转为澄清问题</button></span></div>`;
}

/* ---------- 放行 / 已放行 ---------- */
let relCtx = null;
function releaseChecklist(){
  const s = decisionSummary(S);
  const revsPending = S.gate.revs.filter(r=>r.status!=='已执行');
  const cov = rtmStats();
  return [
    {t:`全部裁决（${s.done}/${s.total}）`, ok:s.done>=s.total},
    {t:`落改闭环：修订工作项全部已执行（${S.gate.revs.filter(r=>r.status==='已执行').length}/${S.gate.revs.length}）`, ok:revsPending.length===0, pend:revsPending.map(r=>r.id)},
    {t:'引用可达（命名空间引用一跳定位）', ok:true},
    {t:'计数同源（速览 ↔ 明细）', ok:true},
    {t:`FR 覆盖（RTM 正向 ${cov.coveredN}/${cov.total}）`, ok:cov.total>0&&cov.coveredN===cov.total},
    {t:'场景列非空（白话可裁决）', ok:true},
  ];
}
function openReleaseModal(){
  const list = releaseChecklist();
  const allOk = list.every(c=>c.ok);
  relCtx = {list, allOk};
  renderModal({type:'release'});
}
function releasedHtml(){
  const G=S.gate;
  return `
  <div class="banner green anim"><b>已放行（r${G.released.round}）</b>
    <span class="sub">${esc(G.released.by)} · ${G.released.at}。放行联动：用例已自动置「已定稿」（来源标注见用例列表）；设计冻结。开发闸解除——但放行=平台权威登记，本地开发入口仍由 guard_dev 机械拦截（guard_dev 改读平台 API，双源已消除）。ack（确认点③）只是流程性定稿信号，不构成质量放行。</span></div>
  ${G.change?changeBanner():''}
  ${G.issues.length?`<div class="card anim"><h3>评审结论归档（r${G.released.round} · 只读）<span class="badge b-gray">裁决记录与引用跳转保留，操作钮隐藏</span></h3>
    ${G.issues.map(x=>issueCard(x,true)).join('')}</div>`:''}
  <div class="card anim"><h3>轮次记录</h3>
    <table class="table"><thead><tr><th>轮次</th><th>裁决单元</th><th>放行时间</th><th>放行人</th><th>状态</th></tr></thead><tbody>
    <tr><td><b>r1</b></td><td>${G.reconcile?G.reconcile.merged:'—'}</td><td>${G.released.at}</td><td>${esc(G.released.by)}</td><td><span class="badge b-green">已放行</span></td></tr>
    ${G.archived.slice(1).map(a=>`<tr><td>r${a.round}（归档只读）</td><td>${a.issues}</td><td>${a.released}</td><td>${esc(a.by)}</td><td><span class="badge b-gray">已归档</span></td></tr>`).join('')}
    </tbody></table>
    <p class="sub" style="margin-top:8px">放行后产物实质变更（GR-3：仅「已放行后」窗口；判定 = 产物内容变更检测·平台化决策，skill 原文为最新份判定+锚点日期比对）→ 常驻提示 + <strong>人工确认</strong>才开新一轮，不自动烧 token。</p>
  </div>`;
}
function changeBanner(){
  const G=S.gate;
  return `<div class="banner amber anim"><b>检测到已放行产物变更</b>
    <span class="sub">${esc(G.change.what)}（${esc(G.change.by)} · ${esc(G.change.at)}）。按 GR-3 需开新一轮评审，r${G.released.round} 结论归档只读。</span>

function grCardHtml(){

      <b>GR-2 开闸三条件 ★</b>：设计已定稿∨轻量跳过 ∧ 用例≥1且全部定稿 ∧ FR 覆盖——skill 原文中「用例定稿」属 sdlc-test 关卡1、「FR 覆盖」属放行机械校验，平台前移为开闸前置（评审对象齐套）<br>

      <b>GR-4 放行</b>：全部裁决 ∧ 落改闭环（有修订事实）∧ 机械校验全绿；平台口径唯一（guard_dev 改读平台 API）；ack 只是定稿信号，不构成质量放行<br>
      <b>GR-5 引用可跳可溯源</b>：跨产物引用统一「命名空间.编号」，一跳定位定义源 + 溯源卡；不可达引用显式报错<br>

    </div></details>`;

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', e=>{
  const rf = e.target.closest('[data-ref]');
  if(rf){ openRef(rf.dataset.ref); return; }
  const elm = e.target.closest('[data-act]');
  if(!elm || elm.disabled) return;
  const act = elm.dataset.act, arg = elm.dataset.arg;
  const st = S, D = st.design, G = st.gate;
  const A = {
    'scen': ()=>{ closeModal(); const v=S.view; S = freshState(arg); S.view=v; },
    'reset-scen': ()=>{ closeModal(); const v=S.view; S = freshState(S.scen); S.view=v; },
    'goto-list': ()=>{ S.view='list'; window.scrollTo(0,0); },
    'iter-open': ()=>{ if(!ITER_LIST.includes(arg)){ toast('原型仅 v3.7.2 / v3.7.1 / v3.8.0（及新建迭代）可交互，历史行为静态演示'); return; }
      S.view='detail'; if(arg===S.iter) render(); else switchIter(arg); window.scrollTo(0,0); },
    'tab': ()=>{ st.tab = arg; },
    'tp-toggle': ()=>{ st.tpOpen = !st.tpOpen; },
    'new-iter': ()=>renderModal({type:'newiter', title:'新建迭代'}),
    'newiter-ok': ()=>{ const v=el('f-iter').value.trim();
      if(!v){ toast('迭代名称必填', true); return; }
      closeModal(); const who=op(); S = freshState('s0'); S.iter=v; S.note='';
      if(!ITER_LIST.includes(v)) ITER_LIST.push(v);
      S.log=[{t:now(), by:who, act:`创建迭代 ${v}`}]; toast(`已创建并进入迭代 ${v}（空迭代）`); },
    'submit-ch': ()=>{ S.subForm = readSubForm(); S.subForm.ch = arg; },
    'submit-ok': ()=>{
      const f = readSubForm();
      if(!f.name){ toast('需求名称必填', true); return; }
      if(!f.by){ toast('提交人必填（归因红线）', true); return; }
      if(f.ch==='feishu' && !f.url){ toast('飞书渠道必须填文档链接', true); return; }
      if(f.ch==='text' && !f.txt){ toast('粘贴文本渠道必须填需求原文', true); return; }
      st.req = { id:'REQ-2026-045', name:f.name, iter:st.iter, sourceType:f.ch, sourceUrl:f.url, sourceText:f.txt,
        status:'submitted', riskTier:'', targetRepo:'', submittedBy:f.by, publishedAt:'', qualityTask:null };
      log(st, `提交需求 REQ-2026-045 ${f.name}（${f.ch==='feishu'?'飞书':'文本'} · 提交人 ${f.by}）`);
      S.subForm={ch:'feishu',name:'',url:'',txt:'',by:''};
      toast('需求卡已创建并 1:1 绑定本迭代——可启动质检'); },
    'start-quality': ()=>{ st.req.qualityTask={status:'running'}; log(st,'启动质检（quality_check · agentscope-inproc）'); toast('质检任务已创建'); },
    'sim-quality-done': ()=>{ const r=st.req; r.qualityTask={status:'done'}; r.status='clarifying'; r.riskTier='A';
      st.clarify = cloneClarify();
      log(st,'质检完成：digest/audit 草稿已采纳，进入待澄清；风险分级 A（digest 回填）'); toast('质检完成——5 问待澄清'); },
    'sim-quality-fail': ()=>{ st.req.qualityTask={status:'failed'}; log(st,'质检失败（原文拉取超时 504）'); },
    'retry-quality': ()=>{ st.req.qualityTask={status:'running'}; log(st,'重试质检任务'); },
    'goto-clarify': ()=>{ st.tab='clarify'; const it=S.clarify.find(c=>c.status==='pending');
      if(it){ st.openGrps['chk:'+it.theme]=true; render(); flashSoon('clr-'+it.seq);
        setTimeout(()=>{ document.querySelector(`textarea[data-clf="${it.seq}"]`)?.focus(); },260); } },
    'gen-standard': ()=>{ st.stdTask={status:'running'}; log(st,'创建 standard_doc 任务'); },
    'sim-std-done': ()=>{ st.stdTask={status:'done'}; log(st,'standard_doc 合成完成（草稿待发布）'); toast('标准文档草稿已就绪——可发布'); },
    'open-publish': ()=>renderModal({type:'publish', title:'发布标准文档（终态）'}),
    'publish-ok': ()=>{ const r=st.req; r.status='published'; r.publishedAt=now();
      log(st,'发布标准文档（终态）· 答复锁定/快照冻结 · 编排自动排产 case_gen'); closeModal(); toast('已发布（终态）——case_gen 已自动排产'); },
    'sim-cases': ()=>{ st.cases = cloneCases(); log(st,'case_gen 完成：7 条用例推送登记（待审核）'); toast('用例 7 条已登记（待审核）'); },
    'config-repo': ()=>renderModal({type:'repo', title:'配置目标代码仓'}),
    'repo-ok': ()=>{ const v=el('f-repo').value.trim();
      if(!v){ toast('路径不能为空', true); return; }
      st.req.targetRepo = v; log(st, `配置目标代码仓：${v}`); closeModal(); toast('目标代码仓已配置'); },
    'gen-design': ()=>ask('创建「技术设计生成」任务？', 'Agent 将读取平台 digest/audit 与目标代码仓勘察后产出设计草稿。产物以草稿回传待你确认。', '创建任务'),
    'declare-skip': ()=>ask('声明轻量跳过（C 级）？', '声明后设计 lane 终态化（留痕可审计）；门禁以自查档执行，放行与开发闸照常。', '声明'),
    'retry-design': ()=>{ D.phase='running'; D.task={type:'design_gen',status:'running'}; log(st,'重试 design_gen 任务'); },
    'cancel-design': ()=>ask('取消任务？', '取消后如需设计须重新创建任务（人取消即终局，L2 不复活）。', '取消', true),
    'sim-design-done': ()=>{ D.phase='draft'; D.task={type:'design_gen',status:'done',result:'9 节全量 · 契约 6 行 · D 表 5 项 · Q 表 1 锁定'};
      log(st,'design_gen 完成，草稿回传（9 节/契约 6 行/D 表 5 项）'); },
    'sim-design-fail': ()=>{ D.phase='failed'; log(st,'design_gen 失败（目标仓不可达）'); },
    'd-mode': ()=>{ D.mode = arg; },
    'save-draft': ()=>toast('草稿已保存（编辑内容写回 draft_artifact）'),
    'drop-draft': ()=>ask('丢弃设计草稿？', '丢弃后如需该产物须重新生成任务。', '丢弃', true),
    'regen-design': ()=>ask('重新生成设计草稿？', '当前草稿将被新草稿覆盖。', '重新生成', true),
    'finalize-design': ()=>renderModal({type:'finalize', title:'设计定稿（确认点②）'}),
    'view-final': ()=>{ D.showDoc = !D.showDoc; },
    'accept-tier': ()=>{ st.req.riskTier=G.tierProposal.to; log(st,`采纳风险升级提案 ${G.tierProposal.from}→${G.tierProposal.to}（证据留痕，三头同步）`); G.tierProposal=null; toast('风险分级已升级（只升不降），在途产物按新档产出'); },
    'reject-tier': ()=>{ log(st,'驳回风险升级提案'); G.tierProposal=null; toast('已驳回提案（留痕）'); },
    'open-q': ()=>{ renderModal({type:'ask', title:'拍板：确认.Q-03', body:'「报名截止后是否自动顺延 72 小时？」\n\n拍板后契约行解锁，锁定标记移除（留痕：操作人+时间）。', confirmText:'拍板：顺延 72h'}); modalCtx._q = true; },
    'case-review': ()=>{ const c=st.cases.find(x=>x.id===arg); if(!c) return;
      c.st='reviewed'; c.src=''; log(st,`用例 ${c.id} 定稿`); toast(`${c.id} 已定稿`); },
    'case-unreview': ()=>{
      const c = st.cases.find(x=>x.id===arg); if(!c) return;
      if(G.phase==='deciding'){ ask('评审中退回定稿用例？', `按 GR-3，评审中变更走「落改」通道或人工「作废重审」。退回 ${c.id} 将把当轮评审置为「重审待确认」。`, '仍要退回', true); modalCtx._unreview=c.id; return; }
      c.st='draft'; delete c.src; log(st,`用例 ${c.id} 退回待审核`); },
    'case-open': ()=>{ if(!S.cases.some(x=>x.id===arg)) return; renderModal({type:'case', id:arg}); },
    'case-edit': ()=>toast('表单用例编辑同现有平台 PATCH（乐观锁 expectedVersion）——原型从略'),
    'cmt-add': ()=>{ const c=st.cases.find(x=>x.id===arg); const t=(el('f-cmt')?.value||'').trim();
      if(!t){ toast('评论内容为空', true); return; }
      c.comments.push({by:op(), at:now(), text:t}); log(st,`评论用例 ${c.id}（反馈维护人 ${c.owner}）`); render(); toast('评论已提交，维护人将在本地迭代后重推'); },
    'defect-toast': ()=>toast('缺陷留在本地工作区 cases.md（不上平台）'),
    'case-form-open': ()=>renderModal({type:'case-form', title:'表单提交用例'}),
    'case-form-ok': ()=>{
      const title=el('cf-title').value.trim();
      const ptsRaw=el('cf-pts').value.trim();
      const steps=el('cf-steps').value.trim();
      const expect=el('cf-expect').value.trim();
      const owner=el('cf-owner').value.trim();
      if(!title) { toast('请填写用例标题', true); return; }
      if(!ptsRaw) { toast('请填写关联需求点', true); return; }
      if(!steps||!expect) { toast('请填写步骤与预期结果', true); return; }
      if(!owner) { toast('请填写来源人（归因红线）', true); return; }
      const points=ptsRaw.split(/[,，、\s]+/).filter(Boolean);
      const unknown=points.filter(p=>!FR_POINTS.some(f=>p==='需求.'+f.id||p===f.id));
      const no=S.cases.reduce((m,c)=>Math.max(m,c.caseNo||0),0)+1;
      const nid='WEB-'+no;
      st.cases.push({id:nid, caseNo:no, title, pts:points.join('、'), st:'draft',
        pri:el('cf-pri').value, owner, tool:'表单',
        pre:el('cf-pre').value.trim(), steps, expect, verifyRefs:[], defectRefs:[], comments:[]});
      log(st,`表单提交用例 ${nid}（${points.join('、')}）`);
      closeModal();
      toast(unknown.length?`已提交。软校验提醒：未在已发布需求点中找到 ${unknown.join('、')}（仍已登记）`:`用例 ${nid} 已登记，需求点关联校验通过`, !!unknown.length); },
    'case-sort': ()=>{ if(S.caseSortKey===arg) S.caseSortDir=S.caseSortDir==='asc'?'desc':'asc';
      else { S.caseSortKey=arg; S.caseSortDir='desc'; } },
    'grp': ()=>{ if(S.openGrps[arg]) delete S.openGrps[arg]; else S.openGrps[arg]=true; },
    'grp-all': ()=>{ allGrpKeys(arg).forEach(k=>S.openGrps[k]=true); },
    'grp-none': ()=>{ Object.keys(S.openGrps).forEach(k=>{ if(k.startsWith(arg)) delete S.openGrps[k]; }); },
    'clf-next': ()=>{ const it=S.clarify.find(c=>c.status==='pending'); if(!it) return;
      if(S.clfFilter==='done') S.clfFilter='all';
      S.openGrps['chk:'+it.theme]=true; render(); flashSoon('clr-'+it.seq);
      setTimeout(()=>{ document.querySelector(`textarea[data-clf="${it.seq}"]`)?.focus(); },260); },
    'jump-audit': ()=>{ S.tab='audit'; S.openGrps['audit:'+(AUDIT_THEME[arg]||'')]=true; render(); flashSoon('audit-'+arg); },
    'jump-clarify': ()=>{ S.tab='clarify'; if(S.clfFilter==='done') S.clfFilter='all';
      const c=S.clarify.find(x=>x.seq===arg); if(c) S.openGrps['chk:'+c.theme]=true;
      render(); flashSoon('clr-'+arg); },
    'dispose-open': ()=>renderModal({type:'dispose', title:arg.endsWith(':rejected')?'驳回问题（不是问题）':'挂起问题（转遗留假设）', arg}),
    'dispose-ok': ()=>{ const [seq,kind]=arg.split(':');
      const note=(el('f-note')?.value||'').trim();
      if(kind==='rejected' && !note){ toast('驳回必须填写理由', true); return; }
      const c=st.clarify.find(x=>x.seq===seq); if(!c) return;
      c.status=kind; c.note=note;
      log(st,`${kind==='rejected'?'驳回':'挂起'}澄清 ${seq}${note?'：'+note:''}`);
      watchStd(st);
      closeModal(); toast(`已${kind==='rejected'?'驳回':'挂起'}：${seq}`); },
    'reopen-clr': ()=>{ const c=st.clarify.find(x=>x.seq===arg); if(!c) return;
      c.status='pending'; c.note='';
      log(st,`重开澄清 ${arg}，可继续作答`); toast(`已重开 ${arg}，可继续作答`); },
    'bulk-review': ()=>{ let n=0; st.cases.forEach(c=>{ if(c.st!=='reviewed'){c.st='reviewed';c.src='';n++;} }); log(st,`批量定稿 ${n} 条用例`); toast(`${n} 条用例已定稿——开闸条件②已满足`); },
    'open-gate': ()=>{ const chk=gateChecks(); if(!chk.every(c=>c.ok)){ toast('开闸条件未满足', true); return; }
      G.phase='running';
      G.roles = st.req.riskTier==='C'
        ? [{name:'主会话自查（C 级）', desc:'五问自查清单，无扇出', st:'running', min:2}]
        : st.req.riskTier==='A'
        ? [{name:'架构一致性',desc:'分层/公共资产/切分约束',st:'running',min:0},{name:'数据模型与 SQL',desc:'DDL/索引/软删对账',st:'running',min:0},{name:'测试可测性',desc:'H 假设接受条件/验证入口',st:'running',min:0},{name:'交叉审查者',desc:'唯一同时读设计×用例，只产分歧',st:'queued',min:0}]
        : [{name:'数据模型与 SQL',desc:'B 级档位',st:'running',min:0},{name:'交叉审查者',desc:'B 级档位',st:'running',min:0}];
      log(st,`开评审 r${G.round}（${st.req.riskTier} 级档位）`); },
    'sim-gate-done': ()=>{ G.phase='summary'; G.reconcile={raw:83, mis:14, tradeoff:9, noise:3, valid:57, merged:41}; log(st,'扇出完成 → RECONCILE 汇总（83→41 裁决单元），机械校验全绿'); },
    'abort-gate': ()=>ask('作废当前评审轮？', '作废后产物可正常变更；如需评审须重新开轮。', '作废', true),
    'to-deciding': ()=>{ G.phase='deciding';
      if(!G.issues.length){ G.issues = BASE_ISSUES.map(i=>({...i})); }
      log(st,'进入裁决（41 裁决单元）'); },
    'goto-deciding': ()=>{ st.tab='gate';
      const t=G.issues.find(i=>!i.dec);
      if(t) setTimeout(()=>{ const n=document.getElementById('iss-'+t.code);
        if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); } },60); },
    'toc': ()=>{ const n=document.getElementById(arg);
      if(n){ n.scrollIntoView({behavior:'smooth',block:'start'}); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); } },
    'jump-next': ()=>{ const t=G.issues.find(i=>!i.dec); if(!t){ toast('没有待裁决项'); return; }
      const n=document.getElementById('iss-'+t.code); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); } },
    'dec': ()=>{ const [code,kind]=arg.split(':'); renderModal({type:'dec', title:`裁决 ${code} · ${kind}`, arg}); },
    'dec-ok': ()=>{ const [code,kind]=arg.split(':');
      const iss=G.issues.find(i=>i.code===code);
      const note=(el('f-note')?.value||'').trim();
      const target=el('f-target')?.value||'';
      if(kind==='驳回' && !note){ toast('驳回必须填理由（它是下轮评审的校准资产）', true); return; }
      iss.dec=kind; iss.by=op();
      iss.note = kind==='落改'?`落点：${target}${note?' · '+note:''}` : kind==='驳回'?note : `去向：${target}${note?' · '+note:''}`;
      if(kind==='落改') G.revs.push({id:'R-'+(G.revs.length+1), target:target+'（'+code+'）', change: note||iss.scene.slice(0,30), status:'待修订', by:'—'});
      log(st,`裁决 ${code} → ${kind}`); closeModal(); },
    're-decide': ()=>{ const iss=G.issues.find(i=>i.code===arg); iss.dec=null; delete iss.by; delete iss.note; log(st,`改判 ${arg}（撤销原裁决）`); },
    'batch-apply': ()=>{ let n=0; G.issues.forEach(i=>{ if(!i.dec && i.suggest){ i.dec=i.suggest; i.by=op(); i.note='（批量预填确认，可单独改判）'; n++; } });
      log(st,`批量确认 AI 预填建议 ${n} 条`); toast(`已确认 ${n} 条（可在条目上单独改判）`); },
    'rev-ai': ()=>{ G.revs[+arg].status='待采纳'; G.revs[+arg].by='agent'; toast('AI 修订草稿已产出，待采纳'); },
    'rev-adopt': ()=>{ const rv=G.revs[+arg]; rv.status='已执行'; rv.by=op();
      if(rv.target.includes('D 表')||rv.target.includes('D5')) S.design.d5ok=true;
      log(st,`采纳修订 ${rv.id}（${rv.target}）→ 已执行`); toast('修订已落盘，置「已执行」'); },
    'doubt-to-clarify': ()=>{ const ds=G.issues.filter(i=>i.dec==='存疑'); log(st,`存疑转澄清问题 ${ds.map(i=>i.code).join('、')}（回流 PM 处置）`); toast(`已生成 ${ds.length} 条澄清问题（复用现有澄清处置流）`); },
    'open-release': ()=>openReleaseModal(),
    'release-ok': ()=>{ G.phase='released'; G.released={round:G.round, by:op(), at:now()};
      st.cases.forEach(c=>{ if(c.st!=='reviewed'){c.st='reviewed'; c.src=`门禁 r${G.round} 放行 · ${op()}`;} else if(!c.src){ c.src=`门禁 r${G.round} 放行 · ${op()}`; } });
      log(st,`门禁 r${G.round} 放行（全部裁决+落改闭环+机械校验全绿）`); closeModal(); toast('已放行 ✓ 用例已自动置定稿（来源已标注）'); },
    'reopen-round': ()=>renderModal({type:'reopen', title:'开新一轮评审'}),
    'reopen-ok': ()=>{ const old={round:G.round, issues:G.reconcile?G.reconcile.merged:G.issues.length, released:G.released.at, by:G.released.by};
      G.archived.unshift(old); G.round++; G.phase='running'; G.change=null; G.issues=[]; G.revs=[];
      G.roles=[{name:'架构一致性',desc:'按当前产物重新扇出',st:'running',min:0},{name:'数据模型与 SQL',desc:'按当前产物重新扇出',st:'running',min:0},{name:'测试可测性',desc:'按当前产物重新扇出',st:'running',min:0},{name:'交叉审查者',desc:'按当前产物重新扇出',st:'running',min:0}];
      log(st,`开新一轮评审 r${G.round}（r${old.round} 归档只读）`); closeModal(); },
    'dismiss-change': ()=>{ log(st,'忽略变更提示（留痕）'); G.change=null; },
    'ref-close': ()=>{ S.refTrace=null; },
    'modal-close': ()=>closeModal(),
    'mask': ()=>{ if(e.target.classList.contains('modal-mask')) closeModal(); return; },
    'ask-ok': ()=>{
      if(modalCtx._q){ D.locked['确认.Q-03']=true; log(st,'拍板 确认.Q-03：报名截止自动顺延 72h'); closeModal(); toast('已拍板，契约行解锁'); return; }
      if(modalCtx._unreview!==undefined){ const c=st.cases.find(x=>x.id===modalCtx._unreview); if(c){ c.st='draft'; delete c.src;
        log(st,`评审中退回 ${c.id} → 当轮评审置「重审待确认」`); } G.phase='blocked'; closeModal(); toast('已退回，当轮评审待确认重开', true); return; }
      const a=modalCtx;
      if(a.title && a.title.includes('技术设计生成')){ D.phase='running'; D.task={type:'design_gen',status:'running',auto:false}; log(st,'创建 design_gen 任务'); }
      if(a.title && a.title.includes('轻量跳过')){ D.phase='skipped'; D.skipDeclared=true; log(st,'声明轻量跳过（C 级，留痕）'); }
      if(a.title && a.title==='取消任务？'){ D.phase='none'; log(st,'取消 design_gen 任务'); }
      if(a.title && a.title.includes('丢弃设计草稿')){ D.phase='none'; log(st,'丢弃设计草稿'); }
      if(a.title && a.title.includes('重新生成设计草稿')){ D.phase='running'; log(st,'重新生成设计草稿'); }
      if(a.title && a.title==='作废当前评审轮？'){ G.phase='none'; log(st,'人工作废当轮评审'); }
      closeModal(); },
    'finalize-ok': ()=>{
      const boxes=[...document.querySelectorAll('#f-checks input')];
      const by=el('f-by').value.trim();
      if(!by){ toast('定稿人必填（归因红线）', true); return; }
      if(boxes.some(b=>b.disabled)){ toast('「锁定待拍板」行未拍板——先回文档处理 确认.Q-03', true); return; }
      if(!boxes.every(b=>b.checked)){ toast('齐套自检六项须全部勾选（漏项即返工）', true); return; }
      D.phase='final'; D.final={by, at:now(), ver:(D.final?.ver||0)+1};
      log(st,`设计定稿（确认点②）v${D.final.ver} · 齐套自检六项全过 · 定稿人 ${by}`); closeModal(); toast('设计已定稿——放行仍需门禁评审'); },
  };
  if(A[act]){ A[act](); render(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  const host=t.closest ? t.closest('[data-act-change]') : null;
  if(host){
    const act=host.dataset.actChange;
    if(act==='gate-filter'){ S.gate.filter=t.value; render(); }
    else if(act==='iter-switch'){ switchIter(t.value); }
    else if(act==='clf-filter'){ S.clfFilter=t.value; render(); }
    else if(act==='case-filter'){ S.caseFilter=t.value; render(); }
    else if(act==='case-q'){ S.caseQ=t.value; render(); }
  }
  const clf=t.closest ? t.closest('[data-clf]') : null;
  if(clf){
    const c=S.clarify.find(x=>x.seq===clf.dataset.clf);
    if(c){ const v=t.value.trim();
      if((c.answer||'')===v) return;
      c.answer=v; c.status = v?'answered':'pending';
      log(S, `澄清 ${c.seq} ${v?'作答':'撤销答复'}（失焦自动保存）`);
      watchStd(S);
      render(); toast(`已保存 ${c.seq}`); }
  }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
    const b=document.querySelector('[data-act="cmt-add"]'); if(b) b.click();
  }
});
document.getElementById('d-scen-select').addEventListener('change', e=>{
  closeModal(); const v=S.view; S=freshState(e.target.value); S.view=v; render();
});
render();
</script>
</body>
